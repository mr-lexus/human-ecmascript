examples:
  - id: declaration-tdz
    title: "TDZ и ранняя инициализация `var`"
    goal: "Сравнить раннее чтение лексической переменной с var-переменной, уже равной undefined."
    sourcePath: examples/declaration-tdz.js
    timeoutMs: 1200
    expectedOutput: ["ReferenceError", "undefined"]
    claimIds: [claim-tdz, claim-var-current]
    citationIds: [lexical-declarations, variable-statement, declarative-environment]
  - id: declaration-block-scope
    title: "Блок и вся функция"
    goal: "Проверить, какие переменные остаются видны после закрывающей фигурной скобки."
    sourcePath: examples/declaration-block-scope.js
    timeoutMs: 1200
    expectedOutput:
      [
        "let stays in the block / const stays in the block",
        "var survives the block",
        "ReferenceError",
      ]
    claimIds: [claim-block-scope]
    citationIds: [lexical-declarations, variable-statement]
  - id: const-object-mutation
    title: "Постоянная переменная с изменяемым объектом"
    goal: "Отделить изменение свойства объекта от записи другого значения в const-переменную."
    sourcePath: examples/const-object-mutation.js
    timeoutMs: 1200
    expectedOutput: ["1", "TypeError"]
    claimIds: [claim-const-binding]
    citationIds: [lexical-declarations, declarative-environment]
  - id: loop-bindings
    title: "Переменные цикла внутри замыканий"
    goal: "Сравнить отдельную переменную каждой итерации с одной общей var-переменной."
    sourcePath: examples/loop-bindings.js
    timeoutMs: 1200
    expectedOutput: ["0,1,2", "3,3,3"]
    claimIds: [claim-loop-bindings]
    citationIds: [create-per-iteration-environment, variable-statement]
  - id: intentional-var-scope
    title: "`var` в ветках и явный `let` перед ветками"
    goal: "Сравнить повторные var-объявления с let-переменной, объявленной в теле функции."
    sourcePath: examples/intentional-var-scope.js
    timeoutMs: 1200
    expectedOutput:
      ["cached value / cached value", "network value / network value", "no value / no value"]
    claimIds: [claim-var-current, claim-block-scope, claim-var-let-branch-equivalence]
    citationIds: [variable-statement]
  - id: declaration-choice
    title: "Значения `const` и счётчик `let`"
    goal: "Выбрать лексическое объявление по тому, переназначается ли сама переменная."
    sourcePath: examples/declaration-choice.js
    timeoutMs: 1200
    expectedOutput: ["60"]
    claimIds: [claim-choice-rule]
    citationIds: [lexical-declarations]
  - id: declaration-bytecode
    title: "Ветка, TDZ и безопасная инициализация"
    goal: "Запустить те же функции с var, let и const, по которым сохранено сравнение байткода."
    sourcePath: examples/declaration-bytecode.js
    timeoutMs: 1200
    expectedOutput:
      [
        "undefined",
        "ReferenceError",
        "ReferenceError",
        "7",
        "7",
        "ReferenceError",
        "12",
        "7",
        "ReferenceError",
        "7",
        "7 undefined",
        "7 undefined",
      ]
    claimIds:
      [
        claim-branch-does-not-create-tdz,
        claim-var-early-read,
        claim-shadowed-binding-tdz,
        claim-shadowing-not-nesting,
        claim-v8-bytecode-capture,
        claim-var-let-baseline-comparison,
      ]
    citationIds: [lexical-declarations, variable-statement, declarative-environment, v8-hole-checks]
  - id: declaration-nesting-bytecode
    title: "Вложенные блоки, захваченные переменные и переменные итераций"
    goal: "Отделить обычное чтение локальной переменной от доступа из вложенной функции и от отдельных переменных итераций `for (let ...)`."
    sourcePath: examples/declaration-nesting-bytecode.js
    timeoutMs: 1200
    expectedOutput: ["7 7", "7 7", "0,1,2", "3,3,3"]
    claimIds:
      [
        claim-nesting-no-runtime-scan,
        claim-function-environment,
        claim-v8-captured-context,
        claim-v8-context-optimization,
      ]
    citationIds: [function-objects, new-function-environment, v8-preparser, v8-sparkplug]
