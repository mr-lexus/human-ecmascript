id: const-let-var-ru
slug: const-let-var
locale: ru
translationOf: const-let-var
sourceContentHash: 99bf12f258080168
title: "const, let и var: без мифов и запретов"
eyebrow: "Переменная → инициализация → область видимости → производительность"
dek: >-
  Ключевое слово выбирают по смыслу программы, а не ради мифического ускорения.
  Разберём, когда появляется значение, откуда берётся TDZ и какие именно правила
  `var` — а не придуманные «лучшие практики» — отличают его от лексических объявлений.
status: LOCALE_REVIEW
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 40
learningObjectives:
  - Различать создание переменной, первое присваивание значения, чтение и последующее переназначение.
  - Предсказывать блочную и функциональную область видимости, TDZ и захват переменных в цикле.
  - Выбирать `const`, `let` или `var`, не опираясь на мифы о производительности.
  - Читать закреплённый байткод Ignition и находить в нём проверку TDZ.
prerequisites:
  - Имя переменной связано с записью в Environment Record.
  - Объект и переменная, которая сейчас на него указывает, — не одно и то же.
sections:
  - id: declaration-mental-model
    title: "Сначала решите, сколько должна жить переменная"
    mode: human
    blocks:
      - id: declaration-mental-model-prose
        type: prose
        body: >-
          Объявление не просто резервирует имя. Оно определяет, где это имя видно, когда его уже
          можно читать и разрешено ли позже записать в переменную другое значение. Берите `const`,
          если сама переменная не должна указывать на другое значение. Берите `let`, если алгоритму
          действительно нужно переназначение. `var` — не сокращение для «одна переменная на всю
          функцию»: то же самое можно явно выразить через `let` в теле функции. Выбирайте `var`,
          только если программе нужны именно его наблюдаемые правила VariableEnvironment.
      - id: declaration-choice-claims
        type: claims
        claims:
          - id: claim-choice-rule
            classification: INFORMATIVE
            text: "Практичное правило для нового кода: `const` при отсутствии переназначения, `let` при переназначении. `var` нужен только тогда, когда частью контракта являются его отличия: раннее значение undefined, отсутствие области обычного блока, слияние повторных объявлений или поведение глобального объявления Script."
            citationIds:
              [lexical-declarations, variable-statement, global-declaration-instantiation]
            sourceFingerprint: e9f03e4511a1a741
            confidence: 0.98
            reviewStatus: TECH_REVIEW
          - id: claim-var-current
            classification: DERIVED
            text: "`var` не устарел и не объявлен deprecated: в ES2026 VariableStatement остаётся действующей нормативной конструкцией со своими правилами области видимости и инициализации."
            citationIds: [variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: declaration-operation-map
        type: operations
        operations:
          - id: op-declarative-environment
            name: Declarative Environment Record
            kind: record
            summary: "Хранит лексические переменные и помнит, можно ли их менять и получили ли они первое значение."
            citationId: declarative-environment
          - id: op-create-mutable-binding
            name: CreateMutableBinding
            kind: abstract-operation
            summary: "Создаёт изменяемую, но пока не инициализированную переменную для `let`."
            citationId: declarative-environment
          - id: op-create-immutable-binding
            name: CreateImmutableBinding
            kind: abstract-operation
            summary: "Создаёт неизменяемую и пока не инициализированную переменную для `const`."
            citationId: declarative-environment
          - id: op-initialize-binding
            name: InitializeBinding
            kind: abstract-operation
            summary: "Записывает первое значение, после чего переменную уже можно читать."
            citationId: declarative-environment
      - id: declaration-choice-note
        type: note
        tone: insight
        title: "`const` защищает переменную, а не объект"
        body: >-
          Запись `const settings = {}` запрещает лишь `settings = другойОбъект`. Сам объект
          `settings` от этого не замораживается: его свойства можно добавлять и менять. Если нужно
          защитить сам объект, потребуются отдельные средства работы с неизменяемыми данными.
      - id: declaration-keyword-decision-guide
        type: trace
        steps:
          - id: choose-const
            label: "`const`: значение есть сразу, переназначения не будет"
            operation: Стабильная переменная
            detail: "Подходит для зависимостей, настроек и промежуточных результатов: `const config = loadConfig()`. Это фиксирует связь имени со значением, но не замораживает объект. Само слово `const` не обещает ускорения."
            citationId: lexical-declarations
          - id: choose-let
            label: "`let`: одна локальная переменная должна меняться"
            operation: Изменяемая локальная переменная
            detail: "Используйте для счётчика, курсора или накопителя: `let total = 0; total += price`. Инициализируйте переменную до ветвлений и держите её в самом узком блоке, где она действительно нужна."
            citationId: lexical-declarations
          - id: choose-var
            label: "`var`: нужна именно семантика VariableEnvironment"
            operation: Специальный контракт
            detail: "В обычной функции var-переменная создаётся и получает `undefined` до выполнения команд; `if` и обычный `{}` не создают ей новую область, а повторные объявления обозначают ту же переменную. Если нужна просто общая изменяемая переменная функции, объявите `let` перед ветками. `var` выбирают, только когда перечисленные отличия сами являются требованием."
            citationId: variable-statement
          - id: reject-keyword-speed-hack
            label: "Не выбирайте ключевое слово только по одной инструкции байткода"
            operation: Проверка здравого смысла
            detail: "В примере с чтением до лексической инициализации замена `let` на `var` убирает TDZ ценой другого поведения. Это не универсальное преобразование. Если `undefined` означает ошибку, исправьте порядок инициализации или структуру блоков. Корректно инициализированные `let` и `const` тоже могут обходиться без `ThrowReferenceErrorIfHole`; скорость горячего кода проверяют бенчмарком после оптимизации."
            citationId: v8-hole-checks
  - id: declaration-normative-trace
    title: "Переменная создаётся заранее, но значение получает не сразу"
    mode: normative
    blocks:
      - id: declaration-normative-prose
        type: prose
        body: >-
          Словом «всплытие» часто называют сразу несколько разных правил. Перед выполнением блока,
          функции или скрипта движок собирает объявления и создаёт переменные. Переменная `var`
          сразу получает `undefined`. Переменные `let` и `const` уже существуют, но остаются без
          значения, пока выполнение не дойдёт до их объявления.
      - id: declaration-trace
        type: trace
        steps:
          - id: trace-collect-declarations
            label: "1. Собрать объявленные имена"
            operation: Scope analysis
            detail: "Скрипт, функция или блок определяют, какие лексические и var-переменные находятся внутри."
            citationId: block-declaration-instantiation
          - id: trace-create-var
            label: "2. Создать `var`"
            operation: VariableEnvironment
            detail: "Для содержащего VariableEnvironment создаётся одна переменная, и ей сразу присваивается undefined."
            citationId: variable-statement
          - id: trace-create-lexical
            label: "3. Создать `let` и `const`"
            operation: BlockDeclarationInstantiation
            detail: "Для `let` создаётся изменяемая переменная, для `const` — неизменяемая. Обе пока не инициализированы."
            citationId: block-declaration-instantiation
          - id: trace-read-before-init
            label: "4. Остановить слишком раннее чтение"
            operation: GetBindingValue
            detail: "Попытка прочитать неинициализированную лексическую переменную завершается ReferenceError. Этот промежуток обычно называют TDZ."
            citationId: declarative-environment
          - id: trace-initialize
            label: "5. Выполнить объявление"
            operation: InitializeBinding
            detail: "Сначала вычисляется правая часть, затем переменная получает первое значение. `let` без начального значения получает undefined именно здесь."
            citationId: lexical-declarations
          - id: trace-reassign
            label: "6. Обработать следующее присваивание"
            operation: SetMutableBinding
            detail: "Значение `let` меняется, а присваивание нового значения переменной `const` завершается TypeError."
            citationId: declarative-environment
      - id: declaration-normative-claims
        type: claims
        claims:
          - id: claim-tdz
            classification: NORMATIVE
            text: "Лексическая переменная создаётся до выполнения объявления, но GetBindingValue выбрасывает ReferenceError, пока переменная не инициализирована."
            citationIds: [lexical-declarations, declarative-environment]
            sourceFingerprint: 41c21f2f3e905eed
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-branch-does-not-create-tdz
            classification: DERIVED
            text: "Сам по себе `if` не создаёт TDZ. Неинициализированный промежуток появляется из-за лексической области и объявления внутри неё; ветка лишь может открыть путь к слишком раннему чтению."
            citationIds:
              [lexical-declarations, block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 9a6e8804e4c6c01f
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-early-read
            classification: NORMATIVE
            text: "При раннем чтении локального `var` проверки TDZ нет: переменная уже инициализирована значением `undefined`. Это другое поведение программы, а не просто более быстрая запись `let`."
            citationIds: [variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-variable-environment-not-storage
            classification: DERIVED
            text: "VariableEnvironment — компонент модели спецификации, а не обещание о физическом объекте или куче. В V8 обычные локальные var/let/const могут находиться в виртуальных регистрах interpreter frame, а захваченные переменные — в Context; одно слово `var` не определяет место хранения."
            citationIds: [execution-context-variable-environment, v8-sparkplug, v8-preparser]
            sourceFingerprint: 6db1debd74c4b9fd
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-const-binding
            classification: NORMATIVE
            text: "`const` создаёт неизменяемую привязку имени к значению; объект, записанный в эту переменную, спецификация неизменяемым не делает."
            citationIds: [lexical-declarations, declarative-environment]
            sourceFingerprint: e9f03e4511a1a741
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-global-script
            classification: NORMATIVE
            text: "На верхнем уровне обычного Script объявления `var` и лексические объявления попадают в разные части Global Environment Record; в Module верхнеуровневый `var` остаётся внутри модуля и не становится свойством глобального объекта."
            citationIds: [global-declaration-instantiation, module-declaration-instantiation]
            sourceFingerprint: 6b7d20470512a09a
            confidence: 0.99
            reviewStatus: TECH_REVIEW
  - id: declaration-observable-cases
    title: "Различия, которые видны в работающем коде"
    mode: observable
    blocks:
      - id: declaration-observable-prose
        type: prose
        body: >-
          Область видимости и момент инициализации меняют поведение программы. Примеры сравнивают
          раннее чтение, видимость после блока, изменение объекта через `const` и функции, которые
          продолжают обращаться к переменным цикла. Отдельный пример показывает `var` в ветках и
          `let`, объявленный перед теми же ветками: для этих входов результат совпадает. Значит,
          сама потребность в одной переменной результата ещё не делает `var` необходимым.
      - id: declaration-observable-claims
        type: claims
        claims:
          - id: claim-block-scope
            classification: OBSERVABLE
            text: "В теле обычной функции `var`, объявленный внутри `if` или обычного блока `{}`, принадлежит VariableEnvironment этой функции и остаётся доступен после блока. Это не превращает любой `var` в «функциональный»: вне обычной функции Script, Module и static initialization block используют собственные алгоритмы инстанцирования."
            citationIds:
              [
                lexical-declarations,
                variable-statement,
                execution-context-variable-environment,
                global-declaration-instantiation,
                module-declaration-instantiation,
                class-static-block,
              ]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-loop-bindings
            classification: OBSERVABLE
            text: "Функция, созданная внутри `for (let ...)`, видит отдельную переменную своей итерации; функции из цикла `for (var ...)` обращаются к одной общей переменной окружающего VariableEnvironment."
            citationIds: [create-per-iteration-environment, variable-statement]
            sourceFingerprint: 8f8f696aa7961cef
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-let-branch-equivalence
            classification: OBSERVABLE
            text: "В сравнительном примере вариант с `var` в ветках и вариант с `let result;` перед ветками возвращают одинаковые строки. Равенство достигается потому, что `let` выполняется до любого чтения и обе функции одинаково присваивают значения; это не делает `var` и `let` взаимозаменяемыми вообще."
            citationIds: [lexical-declarations, variable-statement]
            sourceFingerprint: ef66a654ef921ff4
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: declaration-var-note
        type: note
        tone: warning
        title: "Что должно быть причиной выбрать `var`"
        body: >-
          У `var` нет магического бытового сценария, в котором он автоматически «правильнее» или
          быстрее. Он оправдан, когда код должен наблюдаемо зависеть именно от одного из его правил:
          чтение до текстового объявления даёт `undefined`; обычный блок не ограничивает область;
          повторные `var`-объявления сливаются в одну переменную; верхнеуровневое объявление обычного
          Script участвует в Global Environment иначе, чем `let`. Это встречается при сохранении
          совместимости, в генераторах кода и в обычных Script, которые наблюдают связь глобального
          var-объявления с глобальным объектом. Если нужна всего лишь одна изменяемая переменная
          функции, `let` в теле функции выражает это явно. Не заменяйте `let` на `var`, если
          функциям нужна отдельная переменная каждой итерации.
  - id: declaration-performance
    title: "Производительность: сначала сохранить смысл, потом измерять"
    mode: v8
    blocks:
      - id: declaration-performance-prose
        type: prose
        body: >-
          ECMA-262 задаёт результат, но не обещает, какое ключевое слово окажется быстрее. TDZ — не
          пауза в выполнении, а проверка внутреннего значения «ещё не инициализировано». V8 может
          поставить такую проверку там, где она нужна из-за ветвлений, а уже доказанные повторные
          проверки умеет убирать. Описанное спецификацией окружение каждой итерации тоже не означает,
          что движок обязан физически создавать объект, если ни одно замыкание не сможет его увидеть.
      - id: declaration-performance-claims
        type: claims
        claims:
          - id: claim-v8-hole-check
            classification: V8_IMPLEMENTATION
            text: "Генератор байткода V8 выполняет проверки инициализации лексических переменных и содержит отдельный механизм удаления лишних повторных hole-check."
            citationIds: [v8-hole-checks]
            sourceFingerprint: c5e65ad43b90fb47
            confidence: 0.97
            reviewStatus: TECH_REVIEW
          - id: claim-shadowed-binding-tdz
            classification: DERIVED
            text: "Если внутри блока есть `let p2`, все обращения к `p2` в этом блоке разрешаются во внутренний lexical binding — даже строки выше объявления. Поэтому `p2 = 7` обращается к ещё не инициализированному внутреннему binding и выбрасывает ReferenceError, а не меняет внешний `p2`."
            citationIds: [block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 6ab2d8b76ed13fe1
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-shadowing-not-nesting
            classification: DERIVED
            text: "Сам переход во вложенный блок не создаёт TDZ для внешней переменной. Риск появляется, когда блок объявляет одноимённый `let` или `const`: новая переменная затеняет внешнюю во всём блоке, а любое обращение до инициализации должно завершиться ошибкой."
            citationIds: [block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 6ab2d8b76ed13fe1
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-bytecode-capture
            classification: V8_IMPLEMENTATION
            text: "В закреплённом capture V8 13.6 раннее обращение к затеняющему `let` или `const` содержит `LdaTheHole` и `ThrowReferenceErrorIfHole`. Во вложенном блоке без повторного объявления и в парах `let`/`const`, инициализированных до чтения, такой проверки нет."
            citationIds: [v8-hole-checks]
            sourceFingerprint: 8af584f5e91414c8
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-let-baseline-comparison
            classification: V8_IMPLEMENTATION
            text: "В закреплённом V8 13.6 функции с `var result` в ветках и с `let result` перед теми же ветками возвращают одинаковые значения и не содержат hole-check. Baseline-байткод варианта `var` занимает 25 байт и 13 инструкций, а вариант `let` — 27 байт и 15 инструкций: `let result;` добавляет `LdaUndefined` и `Star0`. Это наблюдение об Ignition данной версии, а не гарантия скорости оптимизированного кода."
            citationIds: [lexical-declarations, variable-statement, v8-hole-checks, v8-sparkplug]
            sourceFingerprint: ea9a7eabdf92cad5
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-nesting-no-runtime-scan
            classification: V8_IMPLEMENTATION
            text: "В закреплённом capture V8 13.6 примеры с локальными `let` и `var` внутри одной функции имеют одинаковую последовательность байткода. Вложенные `if` и цикл не заставляют V8 при каждом чтении заново обходить цепочку блочных областей."
            citationIds: [v8-sparkplug]
            sourceFingerprint: 9737b5e27328fcb3
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-function-environment
            classification: NORMATIVE
            text: "Объект ECMAScript-функции хранит Environment Record во внутреннем слоте `[[Environment]]`. При вызове новая Function Environment Record использует сохранённую запись как `[[OuterEnv]]` — так спецификация описывает доступ функции к внешним переменным."
            citationIds: [function-objects, new-function-environment]
            sourceFingerprint: 529cc80af215a6c0
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-closure-terminology
            classification: DERIVED
            text: "В разговорной речи «замыканием» называют Function Object, который сохраняет доступ к своему лексическому окружению. Это не то же самое, что спецификационный тип `Abstract Closure`, а запуск callback по правилам HTML не заменяет `[[Environment]]` функции."
            citationIds: [function-objects, abstract-closure, html-job-callback]
            sourceFingerprint: 85f0cde66da089d9
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-captured-context
            classification: V8_IMPLEMENTATION
            text: "Если внутренняя функция использует локальную переменную внешней функции, V8 может поместить эту переменную в Context в куче. Это происходит и с захваченным `let`, и с захваченным `var`: путь хранения меняет сам захват, а не одно только ключевое слово."
            citationIds: [v8-preparser]
            sourceFingerprint: fa3faedd8027fe59
            confidence: 0.99
            reviewStatus: TECH_REVIEW
          - id: claim-v8-context-optimization
