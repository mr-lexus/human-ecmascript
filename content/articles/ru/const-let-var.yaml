      - id: declaration-blazing-checklist
        type: trace
        steps:
          - id: blazing-preserve-semantics
            label: "1. Решите, что должно означать раннее чтение"
            operation: Сначала поведение
            detail: "Если раннее чтение должно быть ошибкой, сохраняйте лексическое объявление. Если оно обязано вернуть `undefined` ещё до текстового объявления, это специфическое правило `var`. Когда раннего чтения нет, данное различие не является причиной выбирать ключевое слово."
            citationId: variable-statement
          - id: blazing-initialize-before-branch
            label: "2. Инициализируйте до ветвления"
            operation: Убрать опасный путь
            detail: "Поставьте `let value;` перед `if` либо вычислите значение `const` прямо в инициализаторе. В снятом байткоде V8 последующему чтению уже не нужна инструкция проверки TDZ."
            citationId: lexical-declarations
          - id: blazing-keep-scope-small
            label: "3. Не расширяйте область без причины"
            operation: Сохранить смысл
            detail: "Не растягивайте блочную переменную на всю функцию только ради удаления одной проверки. Широкая область может спрятать старое значение и изменить работу замыканий."
            citationId: block-declaration-instantiation
          - id: blazing-measure-workload
            label: "4. Измеряйте оптимизированную нагрузку"
            operation: Бенчмарк в конце
            detail: "Прогрейте горячую функцию целиком, сохраните настоящие ветвления и выход значений из области, проверьте все целевые движки. Байткод Ignition сам по себе ещё не показывает скорость оптимизированного машинного кода."
      - id: declaration-shadowing-guidance-note
        type: note
        tone: insight
        title: "Практическое правило для `let` и `const` во вложенных блоках"
        body: >-
          Оставляйте переменную в самом узком блоке, который соответствует времени её жизни.
          Переход во вложенный блок сам по себе безопасен: пока там нет повторного объявления,
          обращения продолжают работать с уже инициализированной внешней переменной. Если вы
          намеренно повторяете имя через `let` или `const`, инициализируйте новую переменную до
          любого чтения или присваивания. Иначе внутреннее объявление затеняет внешнее с начала
          блока и появляется путь через TDZ. Часто понятнее дать внутренней переменной другое имя,
          чем заменять её на функциональный `var` и тем самым менять семантику программы.
      - id: declaration-intentional-var-note
        type: note
        tone: implementation
        title: "Что `var` даёт в сравнительном примере"
        body: >-
          Две функции ниже ведут себя одинаково на всех проверяемых входах. В первой повторные
          `var result` в ветках обозначают одну переменную VariableEnvironment. Во второй перед
          ветками явно выполняется `let result;`. Hole-check нет в обоих случаях. В закреплённом
          Ignition вариант `var` короче на `LdaUndefined` и `Star0`, потому что var-переменная уже
          инициализирована при создании окружения, а объявление `let result;` должно выполниться в
          своей позиции. Это честный факт о baseline-байткоде, но не основание обещать выигрыш в
          горячем оптимизированном коде. Для обычного прикладного кода явный `let` чаще понятнее;
          `var` имеет смысл, только если требуются его правила или измерен важный эффект именно на
          целевом runtime.
      - id: declaration-bytecode-artifact
        type: bytecode
        artifactId: const-let-var-tdz
        title: "Проверка TDZ в настоящем байткоде V8"
        body: "Все двенадцать функций сняты из одного файла закреплённым Linux-бинарником Node. Оранжевым отмечены инструкции внутреннего значения «ещё не инициализировано» и возможного ReferenceError."
        cases:
          - id: bytecode-var-branch
            caseId: var-across-branch
            title: "Раннее чтение `var`"
            explanation: "В регистре уже лежит `undefined`. V8 загружает и возвращает его без hole-check, но программа при этом молча получает `undefined`."
          - id: bytecode-let-branch
            caseId: let-across-branch
            title: "Раннее чтение `let`"
            explanation: "Сначала V8 записывает во внутренний регистр специальное значение hole. Ранняя ветка читает его и выполняет `ThrowReferenceErrorIfHole`."
          - id: bytecode-const-branch
            caseId: const-across-branch
            title: "Раннее чтение `const`"
            explanation: "Для `const` механизм TDZ тот же: переменная уже существует, но до выполнения объявления в ней остаётся hole."
          - id: bytecode-initialized-let
            caseId: initialized-let
            title: "`let` объявлен перед `if`"
            explanation: "Объявление выполняется до ветки и записывает `undefined`. Для последующего чтения `ThrowReferenceErrorIfHole` уже не требуется."
          - id: bytecode-initialized-const
            caseId: initialized-const
            title: "`const` получает значение из выражения"
            explanation: "Обе ветки условного выражения вычисляют начальное значение до возврата. В этом capture нет ни hole, ни инструкции выбрасывания TDZ-ошибки."
          - id: bytecode-shadowed-let-before-declaration
            caseId: shadowed-let-before-declaration
            title: "Присваивание перед затеняющим `let`"
            explanation: "Внутренний `p2` затеняет внешний с самого начала блока. V8 записывает hole в `r2`; перед `p2 = 7` проверяется внутренний binding, и исключение возникает раньше самого присваивания."
          - id: bytecode-initialized-shadowed-let
            caseId: initialized-shadowed-let
            title: "Сначала инициализируем затеняющий `let`"
            explanation: "Если поставить `let p2;` перед `p2 = 7`, внутренний binding сначала получит `undefined`. Функция вернёт `12`, а hole-check в этом capture исчезнет."
          - id: bytecode-nested-without-shadowing
            caseId: nested-without-shadowing
            title: "Вложенный блок без повторного объявления"
            explanation: "Внутренний блок записывает и читает уже инициализированный внешний `p2`. В этом 8-байтном capture нет ни `LdaTheHole`, ни `ThrowReferenceErrorIfHole`."
          - id: bytecode-shadowed-const-before-declaration
            caseId: shadowed-const-before-declaration
            title: "Чтение перед затеняющим `const`"
            explanation: "Внутренний `const p2` затеняет внешнюю константу во всём блоке. Поэтому чтение `p2` выше объявления выполняет `ThrowReferenceErrorIfHole`."
          - id: bytecode-initialized-shadowed-const
            caseId: initialized-shadowed-const
            title: "Сначала инициализируем затеняющий `const`"
            explanation: "Если поставить `const p2 = 7` перед чтением, намеренное затенение сохраняется, а путь TDZ и hole-check в этом capture исчезают."
          - id: bytecode-intentional-function-var
            caseId: intentional-function-var
            title: "`var result` внутри нескольких веток"
            explanation: "Обе ветки записывают в одну переменную VariableEnvironment. Hole-check отсутствует. В этом capture функция занимает 25 байт и 13 инструкций."
          - id: bytecode-intentional-function-let
            caseId: intentional-function-let
            title: "Эквивалентный `let result` перед ветками"
            explanation: "Результаты совпадают с вариантом `var`, и hole-check также отсутствует. Выполнение `let result;` добавляет `LdaUndefined` и `Star0`: здесь 27 байт и 15 инструкций."
      - id: declaration-nesting-bytecode-artifact
        type: bytecode
        artifactId: const-let-var-nesting
        title: "Вложенные блоки, захваченные переменные и окружение цикла"
        body: "Здесь отдельно показаны три ситуации, которые часто смешивают: обычное чтение локальной переменной, доступ из вложенной функции и переменная цикла, которую читают после завершения итерации. Длина байткода описывает только закреплённый baseline Ignition — это не замер времени."
        cases:
          - id: bytecode-nested-let-read
            caseId: nested-let-read
            title: "Чтение локального `let` во вложенных блоках"
            explanation: "Переменная остаётся в виртуальном регистре интерпретатора. Цикл и вложенные `if` добавляют переходы, но не поиск по лексическим областям при каждом чтении."
          - id: bytecode-nested-var-read
            caseId: nested-var-read
            title: "Чтение локального `var` во вложенных блоках"
            explanation: "Здесь получается та же 39-байтная последовательность инструкций, что и у `let`. Преимущества только от замены ключевого слова в этом случае нет."
          - id: bytecode-make-captured-let
            caseId: make-captured-let
            title: "Создаём функцию, которая читает внешний `let`"
            explanation: "V8 создаёт Function Context и хранит лексическую переменную в нём. Начальное значение hole относится к правилам инициализации `let`."
          - id: bytecode-make-captured-var
            caseId: make-captured-var
            title: "Создаём функцию, которая читает внешний `var`"
            explanation: "Для захваченного `var` V8 тоже создаёт Function Context, но лексическая инициализация через hole здесь не нужна."
          - id: bytecode-read-captured-let
            caseId: read-captured-let
            title: "Читаем захваченный `let`"
            explanation: "Вложенная функция загружает слот Context; в этом baseline-байткоде остаётся проверка TDZ."
          - id: bytecode-read-captured-var
            caseId: read-captured-var
            title: "Читаем захваченный `var`"
            explanation: "Вложенная функция загружает слот Context без проверки TDZ, потому что var-переменная получила `undefined` ещё при создании окружения функции."
          - id: bytecode-captured-loop-let
            caseId: captured-loop-let
            title: "Захваченная переменная `for (let ...)`"
            explanation: "`CreateBlockContext` обеспечивает отдельную переменную для каждой итерации: позднее функции возвращают `0,1,2`. Это настоящая дополнительная baseline-работа ради другой семантики."
          - id: bytecode-captured-loop-var
            caseId: captured-loop-var
            title: "Захваченная переменная `for (var ...)`"
            explanation: "Одна общая переменная хранится в Function Context, поэтому позднее все функции видят `3`. Это не равноценная ускоренная версия программы с `let`."
      - id: declaration-closure-terminology-note
        type: note
        tone: insight
        title: "Что здесь значит «замыкание»"
        body: >-
          В ECMA-262 нет JavaScript-типа `Closure`. Спецификация говорит, что объект
          ECMAScript-функции содержит код, замкнутый на лексическое окружение, и хранит
          соответствующую Environment Record в `[[Environment]]`. Отдельный тип `Abstract Closure`
          — это служебное мета-значение для алгоритмов самой спецификации, а не результат выполнения
          function expression. HTML при запуске таймера, события или job не создаёт лексическое
          окружение заново: host-алгоритмы восстанавливают браузерное состояние callback, а затем
          вызывают сохранённую функцию через операцию `Call` из ECMA-262.
      - id: declaration-performance-note
        type: note
        tone: implementation
        title: "Что на самом деле доказывает пример `theSum`"
        body: >-
          V8 не путается в двух объявлениях `p2`. Ещё до выполнения scope analysis связывает
          присваивание с внутренней переменной, а hole означает лишь то, что эта уже найденная
          переменная пока не инициализирована. Поэтому исходная функция показывает ошибочный путь
          через TDZ, а не поиск одинаковых имён и не общий проигрыш `let` по скорости. Поставьте
          внутреннее `let p2;` перед `p2 = 7`: функция вернёт `12`, и в этом capture исчезнет
          hole-check. Замена на `var` тоже уберёт блочное затенение, но превратит код в один binding на
          всю функцию — это уже другая семантика, и выбирать её нужно намеренно. Число инструкций
          Ignition описывает холодный baseline-путь этой версии V8, а не производительность
          оптимизированного кода во всех движках.
