id: "typeof-not-type-query-ru"
slug: "typeof-not-type-query"
locale: "ru"
translationOf: "typeof-not-type-query-en"
sourceContentHash: "5c801eba9fce7f25"
title: "typeof — не запрос к системе типов"
eyebrow: "Вычисление → Reference Record → значение → результат"
dek: "Проследим вычисление операнда, Reference Record, GetValue и [[Call]], чтобы точно понять, что означают возвращаемые строки."
status: "LOCALE_REVIEW"
sourceSnapshot: "ECMA-262-ES2026"
readingMinutes: 16
learningObjectives:
  - "Различать неразрешимое имя и существующую привязку в TDZ."
  - "Объяснять строки typeof через порядок шагов алгоритма."
  - "Отделять тип языка, наличие [[Call]] и возможность конструирования."
  - "Указывать, что в document.all задаёт ECMAScript, а что — HTML."
prerequisites:
  - "values-types-memory"
  - "const-let-var"
  - "reference-call-this"
sections:
  - id: "typeof-model"
    title: "Полезное упрощение с точной границей"
    tabLabel: "Ментальная модель"
    mode: "human"
    exampleIds:
      - "typeof-primitive-results"
    blocks:
      - id: "typeof-model-intro"
        type: "prose"
        body: "Для примитивного числа или строки фраза «typeof сообщает тип» — полезное упрощение. Но оператор вычисляет выражение, а не читает запись системы типов. Его результат — String, выбранный определённым алгоритмом. Сначала нужно различить вычисление выражения, которое даёт значение или Reference Record, и последующее чтение значения, описанного Reference Record."
      - id: "typeof-thesis-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-not-type-query"
            classification: "DERIVED"
            text: 'Строки результата не соответствуют типам языка один к одному: Null обозначается строкой `"object"`, а значения Object разделяются по `[[Call]]` и исключению для среды. `"function"` — категория результата, а не девятый тип языка ECMAScript.'
            citationIds:
              - "typeof"
              - "language-types"
              - "is-callable"
            sourceFingerprint: "2899bb9844a8232a95be85caed79364babaf09df97986a2feeb82fb94c1ee093"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-model-link"
        type: "prose"
        body: "Основания разобраны в теме [Значения, типы и хранение](/ru/guide/values-types-memory/): у значений языка ECMAScript есть типы языка, а Reference Record — механизм спецификации для описания вычисления. Это не JavaScript-объект, «тип» которого можно посмотреть. Здесь проследим, как оператор проходит через эту границу."
      - id: "typeof-roadmap"
        type: "note"
        title: "Проверка модели"
        body: 'Отсутствующее простое имя может дать `"undefined"`, а существующая, но неинициализированная лексическая привязка вызывает исключение. Если модель не объясняет оба случая, она неполна. Ни один из результатов не означает, что у JavaScript нет системы типов.'
        tone: "insight"
  - id: "typeof-algorithm"
    title: "Сначала вычисление, затем чтение и классификация"
    tabLabel: "Алгоритм оператора"
    mode: "normative"
    exampleIds:
      - "typeof-evaluation-effects"
    blocks:
      - id: "typeof-algorithm-order"
        type: "prose"
        body: 'Читайте ES2026 §13.5.3.1 по порядку. Шаг 1 вычисляет операнд. Шаг 2 распознаёт неразрешимую Reference Record и возвращает результат досрочно. Шаг 3 выполняет `GetValue`. Шаги 4–10 обрабатывают примитивы, включая явную ветку null. Шаг 11 устанавливает, что оставшееся значение — Object. Шаг 12 обрабатывает `[[IsHTMLDDA]]` среды; шаг 13 проверяет `[[Call]]`; шаг 14 возвращает `"object"`. Если переставить ветки, объяснение изменится.'
      - id: "typeof-algorithm-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-evaluates-operand"
            classification: "NORMATIVE"
            text: "`typeof` сначала вычисляет операнд. Если не сработало исключение для неразрешимой Reference Record, затем выполняется `GetValue`. Аварийное завершение любого из этих шагов передаётся дальше: оператор не подавляет побочные эффекты или исключения."
            citationIds:
              - "typeof"
              - "get-value"
            sourceFingerprint: "537803b82bb0b464895d210ae01b7104ba7ec20092ee55177b41996ae2216a0e"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-unresolvable-reference"
            classification: "NORMATIVE"
            text: 'Если вычисление операнда возвращает Reference Record с `[[Base]]`, равным `unresolvable`, `typeof` возвращает строку `"undefined"` до `GetValue`. Эта ветка не читает значение и не создаёт привязку.'
            citationIds:
              - "typeof"
              - "unresolvable-reference"
              - "reference-record"
            sourceFingerprint: "beba7e169198fa5a93186c69c8ed8bbd50982bd7d63a16c5da15b037c1ee03b4"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-operations"
        type: "operations"
        operations:
          - id: "typeof-op-evaluation"
            name: "typeof — Evaluation"
            kind: "runtime-semantics"
            summary: "Вычисляет операнд и выбирает результат оператора."
            citationId: "typeof"
          - id: "typeof-op-reference"
            name: "Reference Record"
            kind: "record"
            summary: "Описывает обращение, включая основание и имя."
            citationId: "reference-record"
          - id: "typeof-op-getvalue"
            name: "GetValue"
            kind: "abstract-operation"
            summary: "Возвращает готовое значение либо читает значение по Reference Record."
            citationId: "get-value"
      - id: "typeof-effects-explanation"
        type: "prose"
        body: "Литерал вроде `1` даёт значение. Простое имя вроде `value` даёт Reference Record. Выражение свойства вроде `source.value` тоже даёт Reference Record, и `GetValue` может вызвать геттер. В `typeof makeValue()` функция вызывается при вычислении операнда. Счётчики в примере делают эти эффекты наблюдаемыми."
      - id: "typeof-compound-limit"
        type: "note"
        title: "У исключения узкая область действия"
        body: "`typeof missing.property` может выбросить исключение ещё при вычислении операнда: для обращения к свойству нужно прочитать `missing`. Исключение применимо только тогда, когда само завершившееся вычисление операнда возвращает неразрешимую Reference Record. Геттер, который выбрасывает исключение, тоже не защищён оператором `typeof`."
        tone: "warning"
  - id: "typeof-references"
    title: "Неразрешимое имя и неинициализированная привязка"
    tabLabel: "Имя и TDZ"
    mode: "observable"
    exampleIds:
      - "typeof-name-resolution"
      - "typeof-evaluation-effects"
    blocks:
      - id: "typeof-reference-setup"
        type: "prose"
        body: "Возьмём новое имя, для которого нет привязки во всей цепочке окружений. Сравним его с блоком, где `let value;` стоит после чтения. При создании окружения блока эта лексическая привязка появляется до выполнения любой инструкции блока. Позднее объявление инициализирует её; это разные события."
      - id: "trace-typeof-missing-name"
        type: "trace"
        steps:
          - id: "missing-resolve"
            operation: "IdentifierReference → ResolveBinding"
            label: "Разрешить имя"
            detail: "Вычисление идентификатора начинает поиск с текущего лексического окружения."
            citationId: "identifier-evaluation"
          - id: "missing-search"
            operation: "GetIdentifierReference"
            label: "Дойти до конца цепочки"
            detail: "Ни в одном окружении нет привязки; null в конце цепочки даёт [[Base]]: unresolvable."
            citationId: "get-identifier-reference"
          - id: "missing-return"
            operation: "typeof → IsUnresolvableReference"
            label: "Вернуть результат до чтения"
            detail: 'Оператор возвращает строку "undefined". GetValue не выполняется.'
            citationId: "typeof"
      - id: "trace-typeof-tdz"
        type: "trace"
        steps:
          - id: "tdz-create"
            operation: "BlockDeclarationInstantiation"
            label: "Создать привязку"
            detail: "Привязка let в блоке существует, но ещё не инициализирована."
            citationId: "block-instantiation"
          - id: "tdz-resolve"
            operation: "ResolveBinding → GetIdentifierReference"
            label: "Найти привязку"
            detail: "HasBinding находит имя. Основание Reference Record — Environment Record, а не unresolvable."
            citationId: "get-identifier-reference"
          - id: "tdz-read"
            operation: "typeof → GetValue"
            label: "Перейти к обычному чтению"
            detail: "Условие досрочного возврата ложно. GetValue обращается к GetBindingValue окружения."
            citationId: "get-value"
          - id: "tdz-throw"
            operation: "GetBindingValue"
            label: "Отклонить чтение до инициализации"
            detail: "Неинициализированная привязка вызывает ReferenceError; исключение выходит из typeof."
            citationId: "binding-value"
      - id: "typeof-reference-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-tdz-reference-error"
            classification: "DERIVED"
            text: "Лексическая привязка до инициализации разрешима: поиск имени находит её Environment Record. Исключение для неразрешимой Reference Record не применяется; `GetValue` обращается к `GetBindingValue`, который выбрасывает `ReferenceError` для неинициализированной привязки."
            citationIds:
              - "typeof"
              - "get-identifier-reference"
              - "get-value"
              - "binding-value"
              - "block-instantiation"
              - "lexical-declarations"
            sourceFingerprint: "cc3ee8bb6cd2c274cd986871b4b2abbae17c3e12e7ba1eebaf6672b5fad8970d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-observed-reference-boundary"
            classification: "OBSERVABLE"
            text: "Примеры выводят `undefined` для отсутствующего простого имени, перехватывают `ReferenceError` при чтении в TDZ и обращении к свойству через отсутствующее имя, затем выводят `undefined` после выполнения `let value;`. В отдельном примере счётчики геттера и вызова функции достигают 1 при вычислении операндов."
            citationIds:
              - "typeof"
              - "get-value"
              - "binding-value"
              - "lexical-declarations"
            sourceFingerprint: "2774bcbad5233715537963bbe82edbe719448bc2f9bc1ae2cc58f7a4937e663d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-reference-conclusion"
        type: "prose"
        body: 'Когда `let value;` действительно выполняется, привязка инициализируется значением undefined. После этого `typeof value` возвращает `"undefined"` через классификацию значения, а не исключение для отсутствующего имени. Пример перехватывает раннюю ошибку, чтобы выполнение дошло до объявления. Если бы ошибка вышла из блока, оставшиеся инструкции не выполнились бы. Жизненный цикл привязок и затенение разобраны в теме [const, let и var](/ru/guide/const-let-var/).'
  - id: "typeof-results"
    title: "Строки результата не перечисляют типы языка"
    tabLabel: "Категории результата"
    mode: "human"
    exampleIds:
      - "typeof-primitive-results"
      - "typeof-object-collapse"
    blocks:
      - id: "typeof-types-list"
        type: "prose"
        body: "Восемь типов языка в ECMA-262 — Undefined, Null, Boolean, String, Symbol, Number, BigInt и Object. Шесть категорий примитивов, кроме null, соответствуют привычным строкам typeof. Null даёт первое несовпадение; объекты с [[Call]] — ещё одно. Имена типов спецификации с заглавной буквы и строки результата в кавычках обозначают разные вещи."
      - id: "typeof-mapping-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-primitive-mapping"
            classification: "NORMATIVE"
            text: 'Значения Undefined, Boolean, Number, BigInt, String и Symbol дают соответственно `"undefined"`, `"boolean"`, `"number"`, `"bigint"`, `"string"` и `"symbol"`. Это шесть категорий примитивных значений, кроме null.'
            citationIds:
              - "typeof"
              - "language-types"
            sourceFingerprint: "dcceeb61fd71f3b65a60d229659ac07e267f770a83dd742aada3be4d585f456f"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-null-mismatch"
            classification: "DERIVED"
            text: '`null` принадлежит типу языка Null, а оператор явно выбирает для него строку `"object"`. Этот результат не делает `null` значением типа Object.'
            citationIds:
              - "language-types"
              - "typeof"
            sourceFingerprint: "e4ceb4f9fc05cdb397b151ded448dd983eddb7ac6d04cd34304a99a60ed885a0"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-object-collapse"
            classification: "NORMATIVE"
            text: 'Объект, дошедший до последней ветки — без применимого исключения `[[IsHTMLDDA]]` и без `[[Call]]`, — даёт `"object"`. Эта ветка не различает массивы, регулярные выражения, даты, объекты-обёртки и другие разновидности объектов.'
            citationIds:
              - "typeof"
            sourceFingerprint: "9a665d1f710aa6a5a26e1327a436b4383d9fcab9bd0f15e6d96055a65585b19e"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-observed-result-matrix"
            classification: "OBSERVABLE"
            text: "Примеры выводят строки для шести категорий примитивов, кроме null, затем `null:object` и `object` для проверяемых объекта, массива, регулярного выражения, даты и обёртки Number. Наблюдения демонстрируют эти входные данные; общее правило задаёт процитированный алгоритм оператора."
            citationIds:
              - "typeof"
              - "language-types"
            sourceFingerprint: "c3274c8f77fbce4f2a14cfccee3357458e66fbb56a5356c0aab81875151088a9"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-null-history"
        type: "note"
        title: "Что доказывает ветка null"
        body: "Современное требование сформулировано явно. В этой статье мы не приписываем ему историческую причину: раздел об операторе подтверждает нынешнее поведение, но не рассказ о тегах первой реализации. Историческое объяснение потребовало бы отдельного источника и классификации."
        tone: "insight"
      - id: "typeof-collapse-limit"
        type: "prose"
        body: 'В примере намеренно выбраны значения с разным поведением: литерал объекта, массив, RegExp, Date и обёртка Number. Все доходят до одной последней ветки. `typeof x === "object"` не определяет разновидность объекта и не исключает null. Результат — широкая категория, а не описание хранения или интерфейс рефлексии.'
  - id: "typeof-capabilities"
    title: "Наличие внутреннего метода вызова не обещает успешный вызов"
    tabLabel: "Вызов и new"
    mode: "normative"
    exampleIds:
      - "typeof-call-construct"
      - "typeof-proxy-boundary"
    blocks:
      - id: "typeof-capability-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-call-slot"
            classification: "NORMATIVE"
            text: 'После применимой проверки `[[IsHTMLDDA]]` объект с внутренним методом `[[Call]]` даёт `"function"`. Оператор проверяет наличие метода, но не вызывает его и не обращается к `IsCallable`. `IsCallable` использует тот же критерий: Object с `[[Call]]`.'
            citationIds:
              - "typeof"
              - "is-callable"
            sourceFingerprint: "9529ceee0b9c705165830a61faf92858fecb6d23c3abbbf364f6f20a44062468"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-not-constructability"
            classification: "DERIVED"
            text: '`typeof` не проверяет `[[Construct]]`. Обычное объявление функции, стрелочная функция и конструктор класса дают `"function"`, но у стрелки нет `[[Construct]]`, а у двух других форм он есть. Из этого не следует, что конкретное конструирование завершится успешно.'
            citationIds:
              - "typeof"
              - "is-constructor"
              - "function-instantiation"
              - "arrow-instantiation"
              - "class-definition"
              - "make-constructor"
            sourceFingerprint: "cc135dabaaef02a8438688ddea10b07a63154a01ff73cfa46704756489cf8fa9"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-class-call-guard"
            classification: "DERIVED"
            text: 'Конструкторы класса по умолчанию и явно написанные конструкторы имеют `[[Call]]` и дают `"function"`, но прямой вызов выбрасывает исключение. Для явного конструктора `[[Call]]` ECMAScript-функции проверяет `[[IsClassConstructor]]`. Для `class C {}` конструктор по умолчанию проверяет, что `NewTarget` не равен undefined. `new` идёт по пути конструирования.'
            citationIds:
              - "typeof"
              - "class-definition"
              - "function-call"
              - "make-constructor"
              - "is-callable"
            sourceFingerprint: "3f58298a385e274e6471b804a582187c5a188d87a72416ff60d879e135971750"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "trace-typeof-callable-object"
        type: "trace"
        steps:
          - id: "callable-value"
            operation: "Evaluation → GetValue"
            label: "Получить значение Object"
            detail: "Чтение F, arrow или C даёт Object. typeof не вызывает тело функции."
            citationId: "get-value"
          - id: "callable-slot"
            operation: "typeof — [[Call]] branch"
            label: "Проверить внутренний метод"
            detail: 'После исключения примитивов и случая HTMLDDA наличие [[Call]] выбирает "function".'
            citationId: "typeof"
          - id: "callable-call"
            operation: "[[Call]]"
            label: "Разделить классификацию и вызов"
            detail: "Прямой вызов — отдельная последующая операция. Явный конструктор класса отклоняет его через [[IsClassConstructor]], конструктор по умолчанию — через undefined в NewTarget."
            citationId: "class-definition"
          - id: "callable-construct"
            operation: "IsConstructor → [[Construct]]"
            label: "Проверить конструирование отдельно"
            detail: "new требует [[Construct]], который typeof не проверяет. У обычной функции и обоих классов в примере он есть, у стрелки — нет."
            citationId: "is-constructor"
      - id: "typeof-class-precision"
        type: "prose"
        body: "В структурном смысле спецификации конструктор класса допускает вызов: `IsCallable(C)` дал бы true, потому что `[[Call]]` присутствует. Это не означает, что `C()` может нормально завершиться. Для `class C {}` ClassDefinitionEvaluation создаёт встроенный конструктор по умолчанию, чьи шаги отклоняют undefined в `NewTarget`. Для `class Explicit { constructor() {} }` алгоритм помечает ECMAScript-функцию через MakeClassConstructor, а её `[[Call]]` отклоняет эту метку. Пример проверяет оба пути. Модели не нужно представлять их как обычные вызовы функций."
      - id: "typeof-capability-link"
        type: "prose"
        body: "Механизмы `Call`, `Construct` и `new` подробно разобраны в теме [Ссылки, вызовы и this](/ru/guide/reference-call-this/). Здесь они нужны для точной границы: typeof не конструирует и не вызывает полученный объект, поэтому не предсказывает исход этих операций."
      - id: "typeof-proxy-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-proxy-boundary"
            classification: "DERIVED"
            text: '`ProxyCreate` устанавливает `[[Call]]`, если целевой объект допускает вызов. Чтение обычной инициализированной привязки с таким Proxy и применение `typeof` не вызывают ловушки Proxy. Отзыв очищает target и handler, но сохраняет `[[Call]]`, поэтому отозванный вызываемый Proxy всё ещё даёт `"function"`, а попытка вызова выбрасывает исключение.'
            citationIds:
              - "typeof"
              - "proxy-create"
              - "proxy-call"
              - "proxy-revocable"
            sourceFingerprint: "4994f1fc69119429d89c671467bb5befbbbd97cf96f9894700321d28afb0a551"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-observed-capability-boundary"
            classification: "OBSERVABLE"
            text: 'В примерах обычная функция, стрелка, оба конструктора класса и вызываемый Proxy дают `"function"`. Конструирование стрелки и прямые вызовы обоих конструкторов класса выбрасывают `TypeError`. Отзыв не меняет результат typeof для Proxy, но попытка вызова выбрасывает исключение.'
            citationIds:
              - "typeof"
              - "class-definition"
              - "function-call"
              - "arrow-instantiation"
              - "proxy-create"
              - "proxy-call"
              - "proxy-revocable"
            sourceFingerprint: "7490ff48fd3259fbf82225b625cf057d9764fdd35468eaefe7e68cc5d4dac40a"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-proxy-scope"
        type: "note"
        title: "Зачем здесь Proxy"
        body: "Нулевой счётчик ловушки apply и отозванный Proxy различают наличие метода и его выполнение. Утверждение относится к `typeof proxy` при обычной инициализированной привязке. `typeof proxy.property` может вызвать ловушку get при вычислении операнда. Наличие apply в handler само по себе не делает Proxy вызываемым, если целевой объект не допускает вызов."
        tone: "insight"
  - id: "typeof-host-boundary"
    title: "Браузерная среда добавляет особый случай"
    tabLabel: "Среда и выводы"
    mode: "observable"
    exampleIds: []
    blocks:
      - id: "typeof-host-intro"
        type: "prose"
        body: 'В документе браузера `typeof document.all === "undefined"` следует из двух спецификаций. HTML задаёт объект и его внутренний слот; ECMAScript задаёт условную ветку оператора. Это другой путь, чем для неразрешимого идентификатора. До классификации операнд успешно даёт Object.'
      - id: "typeof-host-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-html-dda-hook"
            classification: "NORMATIVE"
            text: 'В браузере или другой среде с поддержкой `[[IsHTMLDDA]]` шаг Normative Optional возвращает `"undefined"` для объекта с этим слотом. Он выполняется до проверки `[[Call]]`. Сама ECMA-262 такие объекты не создаёт.'
            citationIds:
              - "typeof"
              - "html-dda"
            sourceFingerprint: "262c8dfdb4d510c54a64a39b466750a1b1d8e98f4264f6b7852ed8f3bbb4269d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-document-all-host-object"
            classification: "HOST_DEFINED"
            text: 'HTML требует, чтобы `document.all` возвращал `HTMLAllCollection`; у таких объектов есть `[[IsHTMLDDA]]` и собственный `[[Call]]`. Это требование среды вместе с веткой ECMA-262 объясняет `typeof document.all === "undefined"`; сам объект не является примитивным значением undefined.'
            citationIds:
              - "html-document-all"
              - "html-all-collection"
              - "typeof"
              - "html-dda"
            sourceFingerprint: "1fe23b99a844d058d29a923a4b86f754466f1e0de2c714ae1827aa7414c7580d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-host-environment"
        type: "note"
        title: "Только документ браузера"
        body: "HTMLAllCollection имеет и [[IsHTMLDDA]], и [[Call]], но более ранняя проверка слота определяет результат. «Normative Optional» не означает, что соответствующий стандарту браузер может произвольно выбрать результат: условие для браузера и требование HTML задают именно такое поведение. Node и лаборатория сайта на Web Worker не предоставляют документ браузера, поэтому этот фрагмент служит пояснением, а не исполняемым примером лаборатории."
        tone: "warning"
      - id: "typeof-practical-primitives"
        type: "prose"
        body: 'Используйте typeof, когда его категории соответствуют вопросу: отличить примитив Number от String или BigInt — прямое применение алгоритма. `"number"` не обещает конечное число, целое число или допустимость значения для вашей задачи. Строка `"undefined"` сама по себе не различает отсутствующее простое имя, инициализированное значение undefined и случай совместимости HTML.'
      - id: "typeof-practical-references"
        type: "prose"
        body: 'Проверка потенциально отсутствующего глобального имени через typeof полезна, когда поиск имени действительно даёт неразрешимую Reference Record. Лексическое объявление в области видимости может вместо этого поместить то же имя в TDZ. Строка `"function"` подтверждает ветку [[Call]] оператора, но не возможность конструирования или успешный вызов; объект совместимости HTML также мешает считать эту проверку универсальным эквивалентом IsCallable.'
      - id: "typeof-evidence-scope"
        type: "note"
        title: "Что проверяется"
        body: "Шесть переносимых примеров выполняются при валидации контента. Для этой темы не заявлены результаты закреплённой версии движка, байткод, артефакты представления значений или запись запуска в документе браузера. Нормативные утверждения ссылаются на закреплённый ES2026, утверждение о среде — также на фиксированный снимок WHATWG HTML. Материал остаётся на техническом и языковом ревью."
        tone: "insight"
