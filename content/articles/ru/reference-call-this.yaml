id: reference-call-this-ru
slug: reference-call-this
locale: ru
translationOf: reference-call-this
sourceContentHash: 6d6b90ec1941ba90
title: "Почему this зависит от способа вызова"
eyebrow: "От obj.method до запуска функции"
dek: >-
  `this` не записан внутри метода навсегда. Чтобы понять, откуда он берётся,
  разберём по шагам, что JavaScript делает с выражением `obj.method()`.
status: READY
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 24
learningObjectives:
  - Понимать, зачем спецификации нужен Reference Record и какие данные он хранит.
  - Объяснять, почему `obj.method()` и вызов той же функции через переменную дают разный `this`.
  - Объяснять, почему `new` передаёт работу конструктору, а не обещает свежий объект напрямую.
  - "Видеть порядок: имя свойства, чтение свойства, аргументы, тело функции."
prerequisites:
  - Некоторые промежуточные результаты существуют только в описании языка, а не как объекты JavaScript.
  - В strict mode обычный вызов функции получает `undefined` в качестве `this`.
sections:
  - id: mental-model
    title: "Сначала JavaScript запоминает объект"
    mode: human
    blocks:
      - id: mental-model-prose
        type: prose
        body: >-
          Вычисляя `obj.method`, JavaScript не отбрасывает `obj` сразу. В спецификации результат
          описан как служебная запись Reference Record: в ней остаются объект `obj` и имя свойства
          `method`. Поэтому следующие за выражением скобки понимают: функцию нужно вызвать именно
          как метод объекта `obj`. Если же сначала сохранить `obj.method` в переменную, в ней
          останется только функция — связи с `obj` уже не будет.
      - id: mental-model-claims
        type: claims
        claims:
          - id: claim-reference-record
            classification: NORMATIVE
            text: "Reference Record для свойства хранит значение, в котором ищут свойство, и имя этого свойства. Это служебная конструкция спецификации: получить её из JavaScript-кода нельзя."
            citationIds: [reference-record]
            sourceFingerprint: a4eddf680870da11
            confidence: 1
            reviewStatus: READY
          - id: claim-member-reference
            classification: DERIVED
            text: "Промежуточная запись позволяет отличить вызов `obj.method()` от вызова той же функции после присваивания переменной."
            citationIds: [property-accessors, evaluate-call]
            sourceFingerprint: f20b9c5fb2e6163c
            confidence: 0.98
            reviewStatus: READY
      - id: operation-map
        type: operations
        operations:
          - id: op-reference-record
            name: Reference Record
            kind: record
            summary: "Связывает объект `obj` с именем свойства `method`."
            citationId: reference-record
          - id: op-get-value
            name: GetValue
            kind: abstract-operation
            summary: "Получает из Reference обычное значение JavaScript — в нашем случае функцию."
            citationId: get-value
          - id: op-evaluate-call
            name: EvaluateCall
            kind: runtime-semantics
            summary: "Определяет функцию и значение `this`, а затем вычисляет аргументы."
            citationId: evaluate-call
          - id: op-call
            name: Call
            kind: abstract-operation
            summary: "Запускает функцию и передаёт ей выбранное значение `this`."
            citationId: call
  - id: normative-trace
    title: "Как спецификация разбирает `obj.method()`"
    mode: normative
    blocks:
      - id: normative-prose
        type: prose
        body: >-
          Всё важное происходит ещё до входа в тело метода. Сначала выражение доступа к свойству
          создаёт Reference. Затем EvaluateCall получает из него функцию и будущий `this`.
          Только после этого вычисляются аргументы и выполняется Call.
      - id: call-trace
        type: trace
        steps:
          - id: trace-base
            label: "1. Вычислить `obj`"
            operation: MemberExpression
            detail: "Получить объект, в котором JavaScript будет искать свойство `method`."
            citationId: property-accessors
          - id: trace-key
            label: "2. Подготовить имя свойства"
            operation: ToPropertyKey
            detail: "В записи через квадратные скобки вычислить выражение и преобразовать результат в ключ свойства."
            citationId: to-property-key
          - id: trace-reference
            label: "3. Запомнить связь с объектом"
            operation: Reference Record
            detail: "Создать Reference Record, в котором связаны `obj` и имя `method`."
            citationId: reference-record
          - id: trace-value
            label: "4. Получить функцию"
            operation: GetValue
            detail: "GetValue обращается к внутреннему методу [[Get]] объекта `obj` и получает значение свойства."
            citationId: get-value
          - id: trace-this
            label: "5. Определить `this`"
            operation: EvaluateCall
            detail: "Поскольку вызов начался со ссылки на свойство, объект `obj` становится значением `this`."
            citationId: evaluate-call
          - id: trace-arguments
            label: "6. Вычислить аргументы"
            operation: ArgumentListEvaluation
            detail: "Выражения внутри скобок выполняются после того, как функция и `this` уже определены."
            citationId: evaluate-call
          - id: trace-call
            label: "7. Запустить функцию"
            operation: Call
            detail: "Операция Call передаёт функции найденный `this` и готовые аргументы."
            citationId: call
      - id: normative-claims
        type: claims
        claims:
          - id: claim-evaluatecall-this
            classification: NORMATIVE
            text: "Если выражение перед скобками вернуло ссылку на свойство, EvaluateCall берёт `this` из этой ссылки. Аргументы вычисляются уже после этого."
            citationIds: [evaluate-call, get-this-value]
            sourceFingerprint: eef6eb3136422ebc
            confidence: 1
            reviewStatus: READY
          - id: claim-getvalue-receiver
            classification: NORMATIVE
            text: "GetValue получает значение свойства через внутренний метод [[Get]] и передаёт ему receiver, сохранённый в Reference."
            citationIds: [get-value, object-get]
            sourceFingerprint: d833185a549caf49
            confidence: 1
            reviewStatus: READY
  - id: construction-call
    title: "`new` запрашивает конструирование, а не означает «создать объект»"
    mode: normative
    blocks:
      - id: construction-prose
        type: prose
        body: >-
          Фраза «`new` создаёт объект» подходит как первое приближение, но не как определение
          оператора. Лексически `new` — зарезервированное ключевое слово; в выражении ECMA-262
          описывает его как оператор `new`. EvaluateNew вычисляет значение после `new` и аргументы,
          отклоняет значение, которое не является конструктором, и передаёт работу операции
          Construct. Та вызывает внутренний метод `[[Construct]]` выбранного значения. Создание
          объекта и выбор итогового результата относятся к протоколу конструирования, а не к самому
          токену `new`.
      - id: construction-trace
        type: trace
        steps:
          - id: construct-evaluate
            label: "1. Вычислить конструктор и аргументы"
            operation: EvaluateNew
            detail: "Получить значение — кандидат в конструкторы — и подготовить список аргументов."
            citationId: evaluate-new
          - id: construct-check
            label: "2. Проверить возможность конструирования"
            operation: IsConstructor
            detail: "Выбросить TypeError, если у значения нет внутреннего метода `[[Construct]]`."
            citationId: evaluate-new
          - id: construct-delegate
            label: "3. Передать управление конструктору"
            operation: Construct
            detail: "Вызвать собственный внутренний метод `[[Construct]]` объекта-конструктора."
            citationId: construct
          - id: construct-this
            label: "4. Подготовить `this` обычного базового конструктора"
            operation: "[[Construct]]"
            detail: "Создать объект-кандидат на основе `newTarget.prototype` и связать его с `this`."
            citationId: function-construct
          - id: construct-body
            label: "5. Выполнить тело конструктора"
            operation: OrdinaryCallEvaluateBody
            detail: "Запустить тело функции с подготовленным `this` и вычисленными аргументами."
            citationId: function-construct
          - id: construct-result
            label: "6. Выбрать результат"
            operation: "[[Construct]]"
            detail: "Вернуть явно возвращённый Object; иначе для базового конструктора вернуть подготовленный объект `this`."
            citationId: function-construct
      - id: construction-claims
        type: claims
        claims:
          - id: claim-new-delegates
            classification: NORMATIVE
            text: "Оператор `new` сам не выполняет алгоритм выделения объекта: EvaluateNew проверяет IsConstructor и передаёт работу Construct, а та вызывает внутренний метод `[[Construct]]` выбранного объекта."
            citationIds: [evaluate-new, construct]
            sourceFingerprint: d7fa66217a54d5fc
            confidence: 1
            reviewStatus: READY
          - id: claim-ordinary-construct-this
            classification: NORMATIVE
            text: "Для обычного базового конструктора `[[Construct]]` создаёт объект-кандидат, связывает его с `this`, выполняет тело и возвращает либо явно возвращённый Object, либо этот объект-кандидат. Возврат примитива кандидата не заменяет."
            citationIds: [function-construct]
            sourceFingerprint: e3697be72d88fbdc
            confidence: 1
            reviewStatus: READY
          - id: claim-constructability-not-return
            classification: NORMATIVE
            text: "Возможность конструирования определяется наличием `[[Construct]]`, а не наличием `return` в теле. Обычные объявления функций становятся конструкторами при создании; стрелочные функции — нет."
            citationIds: [ordinary-function-instantiation, arrow-function-instantiation]
            sourceFingerprint: fea937096e9edc96
            confidence: 1
            reviewStatus: READY
          - id: claim-new-result-not-fresh
            classification: OBSERVABLE
            text: "Объект, полученный из `new C()`, не обязан быть свежим кандидатом, связанным с `this`: обычный конструктор может вернуть другой Object, а ловушка construct у Proxy — уже существующий Object."
            citationIds: [function-construct, proxy-construct]
            sourceFingerprint: 0e7686fbf7e0d47c
            confidence: 1
            reviewStatus: READY
      - id: construction-boundaries
        type: note
        tone: warning
        title: "Возможность вызова и конструирования — разные свойства"
        body: >-
          Обычные объявления и выражения `function`, как правило, имеют и `[[Call]]`, и
          `[[Construct]]`. Стрелочные, async-, generator-функции и функции из краткой записи метода
          можно вызывать, но нельзя использовать как конструкторы. Классы, наоборот, являются
          конструкторами, но выбрасывают исключение при вызове без `new`. Поэтому небезопасны оба
          правила: «любую функцию можно вызвать с `new`» и «любой конструктор можно вызвать и с
          `new`, и без него».
  - id: observable-cases
    title: "Проверьте это на восьми примерах"
    mode: observable
    blocks:
      - id: observable-prose
        type: prose
        body: >-
          Каждый пример меняет только одну деталь вызова. Запускайте код, редактируйте его и
          сравнивайте вывод с ожидаемым. Результат справа получен в вашем браузере; ниже отдельно
          показаны результаты, заранее проверенные в конкретных версиях движков.
      - id: observable-claims
        type: claims
        claims:
          - id: claim-detach-loses-reference
            classification: OBSERVABLE
            text: "После присваивания `const fn = obj.method` переменная хранит только функцию. При вызове `fn()` объект `obj` уже не становится значением `this`."
            citationIds: [get-value, evaluate-call]
            sourceFingerprint: f98c12c16ad837bd
            confidence: 0.99
            reviewStatus: READY
          - id: claim-evaluation-order
            classification: OBSERVABLE
            text: "JavaScript сначала читает свойство, затем вычисляет аргументы и только потом входит в тело функции."
            citationIds: [property-accessors, evaluate-call]
            sourceFingerprint: 142a00c38ed74623
            confidence: 0.99
            reviewStatus: READY
      - id: evaluation-order-note
        type: note
        tone: insight
        title: "Даже getter не обязательно теряет `this`"
        body: >-
          Getter может вернуть функцию, но запись `obj.method()` всё равно остаётся вызовом свойства
          объекта `obj`. Поэтому возвращённая функция получит `obj` в качестве `this`.
  - id: implementation-boundary
    title: "Как это может выглядеть внутри V8"
    mode: v8
    blocks:
      - id: v8-prose
        type: prose
        body: >-
          Reference Record — модель из спецификации, а не обязательный объект в памяти. V8 может
          передать те же данные через байткод Ignition, inline cache или оптимизированный машинный
          код. Важно только сохранить поведение программы. Поэтому материалы о V8 всегда привязаны
          к конкретной версии и не заменяют требования стандарта.
      - id: v8-claims
        type: claims
        claims:
          - id: claim-v8-boundary
            classification: V8_IMPLEMENTATION
            text: "Ignition выполняет байткод V8. Набор инструкций и работа оптимизирующих уровней относятся к реализации и могут измениться в следующей версии движка."
            citationIds: [v8-ignition]
            sourceFingerprint: 50f2ac0e841920ca
            confidence: 0.95
            reviewStatus: READY
      - id: v8-warning
        type: note
        tone: implementation
        title: "Реализация — не стандарт"
        body: "Этот раздел помогает понять одну закреплённую версию V8. Другие движки вправе устроить выполнение совсем иначе."
