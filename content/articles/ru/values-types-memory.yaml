id: values-types-memory-ru
slug: values-types-memory
locale: ru
translationOf: values-types-memory
sourceContentHash: 7c00036ebf52c50e
title: "Primitive value, Reference Record и реальное хранение"
eyebrow: "Термины спецификации → поиск имени → устройство V8"
dek: >-
  ECMA-262 определяет точный термин primitive value, но не отдельный тип Primitive и не тип языка
  reference. Проследим, как имя проходит через Environment Record и Reference Record, а затем
  отделим эту смысловую модель от Smi, heap-объектов и слотов V8.
status: LOCALE_REVIEW
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 36
learningObjectives:
  - Читать тип ECMAScript как множество значений, а не как C++-описание памяти.
  - Пользоваться точным термином primitive value и отличать типы языка от служебных типов спецификации.
  - Проследить имя через ResolveBinding, Environment Records, Reference Record и GetValue.
  - Не смешивать место binding в V8 с представлением Smi, heap-объекта или оптимизированного значения.
prerequisites:
  - Идентификатор, его binding и полученное из binding значение — разные вещи.
  - ECMA-262 задаёт наблюдаемое поведение, а не обязательную раскладку по stack и heap.
sections:
  - id: values-mental-model
    title: "Начнём с терминов, которые действительно есть в спецификации"
    mode: human
    blocks:
      - id: values-mental-model-prose
        type: prose
        body: >-
          В ECMA-262 тип — это множество значений. Типов языка восемь: Undefined, Null, Boolean,
          String, Symbol, Number, BigInt и Object. Primitive value — значение, которое входит в одно
          из первых семи множеств. Именно primitive value является термином стандарта; отдельного типа
          `Primitive` в списке нет. Из этого определения нельзя узнать, попадёт значение в stack,
          машинный регистр или heap-объект: стандарт здесь отвечает на другой вопрос.
      - id: values-core-claims
        type: claims
        claims:
          - id: claim-type-is-set
            classification: NORMATIVE
            text: "ECMA-262 определяет тип как множество значений. Тип языка классифицирует значения, но не задаёт их физическое представление."
            citationIds: [type-definition, language-types]
            sourceFingerprint: d4667f472567921c
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-language-types
            classification: NORMATIVE
            text: "Типы языка ECMAScript: Undefined, Null, Boolean, String, Symbol, Number, BigInt и Object. Primitive value — член множества Undefined, Null, Boolean, Number, BigInt, Symbol или String."
            citationIds: [language-types, primitive-value-definition]
            sourceFingerprint: 7cad09a970ce4a31
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-no-primitive-type
            classification: DERIVED
            text: "`primitive value` — точный термин спецификации. Отдельного типа `Primitive` в списке типов языка нет, поэтому слово «примитив» нельзя превращать в формальный тип или класс хранения."
            citationIds: [primitive-value-definition, language-types]
            sourceFingerprint: 2736b7f18ed084d3
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-no-reference-language-type
            classification: DERIVED
            text: "Типа языка `reference` в списке тоже нет. Reference Record — служебный тип спецификации; его нельзя положить в свойство объекта или переменную JavaScript."
            citationIds: [language-types, specification-types, reference-record]
            sourceFingerprint: 67cb5bfa268d443a
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-integer-is-number
            classification: NORMATIVE
            text: "Литерал `42` создаёт значение типа Number. Слово integer описывает целые числа и встречается в алгоритмах спецификации, но отдельного типа языка Integer нет. А `42n` — уже BigInt."
            citationIds: [language-types, number-type, bigint-type]
            sourceFingerprint: 875220aebf6d36a9
            confidence: 1
            reviewStatus: LOCALE_REVIEW
      - id: values-terminology-note
        type: note
        tone: warning
        title: "Primitive value — не категория памяти"
        body: >-
          В информативном примечании к определению сказано, что primitive value представляется
          напрямую на нижнем уровне реализации. Это не нормативное правило «всегда лежит в stack».
          В V8 один Number может быть Smi, другой Number — HeapNumber, а String, Symbol и BigInt могут
          быть heap-объектами. Категория спецификации при этом не меняется.
  - id: values-normative-model
    title: "Что происходит, когда программа вычисляет имя"
    mode: normative
    blocks:
      - id: values-normative-prose
        type: prose
        body: >-
          Возьмём `let target = source`. Идентификатор `source` не превращается прямо в адрес.
          Его runtime semantics вызывают ResolveBinding. Операция берёт LexicalEnvironment текущего
          execution context, а GetIdentifierReference спрашивает у Environment Records, где объявлен
          binding. При успехе создаётся Reference Record: в [[Base]] попадает найденный Environment
          Record, в [[ReferencedName]] — строка `source`. Затем GetValue вызывает GetBindingValue и
          получает уже значение языка ECMAScript.
      - id: values-operation-map
        type: operations
        operations:
          - id: op-environment-record-value-topic
            name: Environment Record
            kind: record
            summary: "Служебный тип, которым спецификация моделирует bindings имён и лексическую вложенность."
            citationId: environment-records
          - id: op-resolve-binding-value-topic
            name: ResolveBinding
            kind: abstract-operation
            summary: "Начинает поиск имени с LexicalEnvironment текущего execution context."
            citationId: resolve-binding
          - id: op-get-identifier-reference-value-topic
            name: GetIdentifierReference
            kind: abstract-operation
            summary: "Идёт по цепочке Environment Records и возвращает Reference Record найденного binding."
            citationId: get-identifier-reference
          - id: op-reference-record-value-topic
            name: Reference Record
            kind: record
            summary: "Служебное значение, которое описывает найденный binding или свойство для следующих алгоритмов."
            citationId: reference-record
          - id: op-get-value-value-topic
            name: GetValue
            kind: abstract-operation
            summary: "Если [[Base]] — Environment Record, вызывает GetBindingValue и возвращает значение языка."
            citationId: reference-record
      - id: values-assignment-trace
        type: trace
        steps:
          - id: trace-evaluate-source
            label: "1. Вычислить IdentifierReference `source`"
            operation: IdentifierReference Evaluation
            detail: "Runtime semantics грамматики возвращают ? ResolveBinding(StringValue имени `source`)."
            citationId: identifier-evaluation
          - id: trace-resolve-binding
            label: "2. Выбрать начальное лексическое окружение"
            operation: ResolveBinding
            detail: "ResolveBinding берёт LexicalEnvironment работающего execution context и передаёт его в GetIdentifierReference."
            citationId: resolve-binding
          - id: trace-find-binding
            label: "3. Пройти по цепочке Environment Records"
            operation: GetIdentifierReference
            detail: "На текущем Environment Record вызывается HasBinding. Если имени нет, поиск идёт в [[OuterEnv]]; при успехе создаётся Reference Record."
            citationId: get-identifier-reference
          - id: trace-get-source-value
            label: "4. Получить значение языка"
            operation: GetValue
            detail: "Поскольку [[Base]] — Environment Record, GetValue вызывает GetBindingValue с [[ReferencedName]] и [[Strict]]."
            citationId: reference-record
          - id: trace-evaluate-target
            label: "5. Инициализировать или присвоить destination"
            operation: Assignment evaluation
            detail: "Алгоритм назначения получает значение языка. Про копирование байтов, указатели, stack или heap ECMA-262 на этом шаге ничего не говорит."
            citationId: assignment-operators
      - id: values-normative-claims
        type: claims
        claims:
          - id: claim-reference-spec-artifact
            classification: NORMATIVE
            text: "Reference Record и Environment Record — служебные артефакты спецификации. Они не обязаны соответствовать отдельным сущностям реализации, и JavaScript-код не может хранить их в переменных или свойствах."
            citationIds: [specification-types, reference-record, environment-records]
            sourceFingerprint: 0138fa96dbbfbb06
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-reference-not-pointer
            classification: DERIVED
            text: "Reference Record — не доступный программе указатель и не адрес в heap. Это запись спецификации, которую используют GetValue, PutValue и алгоритмы вызова."
            citationIds: [specification-types, reference-record]
            sourceFingerprint: 9b2abc96f6215bb2
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-assignment-transfers-value
            classification: DERIVED
            text: "Присваивание получает значение языка из правого выражения и передаёт его в PutValue для Reference Record левой части. Отдельных режимов языка «копировать по значению» и «копировать по ссылке» алгоритм не задаёт."
            citationIds: [assignment-operators, reference-record]
            sourceFingerprint: 07a6eab892028701
            confidence: 0.99
            reviewStatus: LOCALE_REVIEW
          - id: claim-parameters-receive-values
            classification: DERIVED
            text: "Параметр функции инициализируется значением соответствующего аргумента. Если присвоить параметру другое значение, переменная вызывающего кода не изменится."
            citationIds: [function-instantiation]
            sourceFingerprint: 36bedc4b87df13ea
            confidence: 0.99
            reviewStatus: LOCALE_REVIEW
          - id: claim-strings-immutable
            classification: NORMATIVE
            text: "Значение String — неизменяемая последовательность кодовых единиц UTF-16. Движок вправе переиспользовать или интернировать память строки, но для JavaScript это всё равно неизменяемое значение String."
            citationIds: [string-type]
            sourceFingerprint: 271250dc77ab3f67
            confidence: 1
            reviewStatus: LOCALE_REVIEW
  - id: values-observable-behavior
    title: "Что действительно наблюдается из JavaScript"
    mode: observable
    blocks:
      - id: values-observable-prose
        type: prose
        body: >-
          JavaScript позволяет проверить, дали ли два выражения один Object или один Symbol, и увидеть
          изменение Object через другой binding. Но нельзя получить адрес, спросить, где находится
          слот binding, или узнать, разделяют ли равные строки внутреннее хранилище. Это решения
          реализации, а не типы языка.
      - id: values-observable-claims
        type: claims
        claims:
          - id: claim-value-rebinding-independent
            classification: OBSERVABLE
            text: "После `let b = a` присваивание другого Number или String в `b` не меняет значение, получаемое из `a`. Это наблюдение ничего не говорит о физическом хранении bindings."
            citationIds: [language-types, assignment-operators]
            sourceFingerprint: edc13cd582940a08
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-object-aliasing
            classification: OBSERVABLE
            text: "Если две переменные содержат одно значение Object, изменение объекта через одну переменную видно через другую. Если одной переменной присвоить новый объект, вторая не переключится вслед за ней."
            citationIds: [object-type, assignment-operators]
            sourceFingerprint: fbcf042113f58e56
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-not-pass-by-reference
            classification: OBSERVABLE
            text: "Функция не может заменить переменную вызывающего кода простым присваиванием своему параметру. Зато она может изменить переданный объект: в начале вызова параметр и внешняя переменная содержат одно значение Object."
            citationIds: [function-instantiation, object-type]
            sourceFingerprint: 5fd8c31be7f6c4c0
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-symbol-identity
            classification: NORMATIVE
            text: "Каждый вызов `Symbol(description)` возвращает уникальное значение Symbol. Symbol — один из типов языка, каждое его значение является primitive value, а описание не задаёт идентичность."
            citationIds: [symbol-type, symbol-constructor]
            sourceFingerprint: 241183623c85395f
            confidence: 1
            reviewStatus: LOCALE_REVIEW
      - id: values-observable-note
        type: note
        tone: warning
        title: "Общий Object не создаёт ссылочный тип"
        body: >-
          Два binding могут выдавать одно значение Object. Изменение этого Object видно через оба
          пути, а переприсваивание одного имени не перенаправляет второе. Для этого правила не нужны
          C++-ссылка, доступный указатель или дополнительный тип ECMAScript.
  - id: values-v8-representation
    title: "Хранение в V8: представление значения и место binding — разные решения"
    mode: v8
    blocks:
      - id: values-v8-prose
        type: prose
        body: >-
          В закреплённой x64-сборке V8 число `42` помещается в tagged-immediate Smi: отдельный
          HeapNumber для него не создаётся. Но место хранения `42` — другой вопрос. В Ignition
          незахваченная локальная переменная может жить в регистре frame. Если binding захватывает
          closure, V8 создаёт Context и пишет тот же Smi в слот heap-контекста. Symbol в таком слоте —
          уже tagged-указатель на отдельный Symbol-объект. По одному объявлению нельзя нарисовать
          постоянное место значения.
      - id: values-v8-claims
        type: claims
        claims:
          - id: claim-v8-smi
            classification: V8_IMPLEMENTATION
            text: "В закреплённой x64-сборке V8 13.6 значение `42` имеет представление Smi: маленькое целое закодировано прямо в tagged value, отдельный HeapNumber для него не нужен."
            citationIds: [v8-pointer-compression, v8-smi-source]
            sourceFingerprint: bbf2378a03431130
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-v8-binding-storage
            classification: V8_IMPLEMENTATION
            text: "В capture Ignition незахваченный локальный Smi находится в регистре frame, а для захваченных bindings видны CreateFunctionContext и StaCurrentContextSlot. У захваченного Smi нет отдельного number-объекта, хотя его tagged-биты лежат в слоте heap-контекста."
            citationIds: [v8-ignition-frame, v8-pointer-compression]
            sourceFingerprint: 5d92dfbba4cd5039
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-v8-string-internalization
            classification: V8_IMPLEMENTATION
            text: "Два binding могут содержать String value, а их слоты V8 — указывать на один internalized String object. Это переиспользование памяти в V8, а не наблюдаемая идентичность String и не передача переменной по ссылке в ECMAScript."
            citationIds: [string-type, v8-strings]
            sourceFingerprint: dc8bed6765990f12
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-v8-symbol-heap
            classification: V8_IMPLEMENTATION
            text: 'В capture `Symbol("guide")` — heap-объект с типом `SYMBOL_TYPE`. В исходниках V8 Symbol наследуется от Name, Name — от PrimitiveHeapObject, а слот binding хранит tagged-указатель на этот объект.'
            citationIds: [v8-symbol-source]
            sourceFingerprint: b10627869679eaf3
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-layout-not-language-type
            classification: DERIVED
            text: "Primitive value не означает «inline или stack»: Symbol является primitive value, но представлен V8 heap-объектом; захваченный Smi лежит внутри heap-контекста, хотя не становится отдельным heap-объектом."
            citationIds: [language-types, v8-pointer-compression, v8-symbol-source]
            sourceFingerprint: ae193b5b1c8c74c4
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-v8-optimized-representations
            classification: V8_IMPLEMENTATION
            text: "Оптимизирующие уровни V8 могут работать с распакованными числами и упаковать их обратно только при необходимости. По исходному объявлению нельзя однозначно нарисовать постоянное место в стеке или heap."
            citationIds: [v8-maglev]
            sourceFingerprint: f09b508effec5328
            confidence: 0.99
            reviewStatus: LOCALE_REVIEW
      - id: values-v8-binding-bytecode
        type: bytecode
        artifactId: value-binding-storage
        title: "Binding выбирает слот, значение определяет содержимое слота"
        body: "Байткод получен из закреплённой Linux-сборки V8. Подсвечены команды локального регистра и создания или записи closure Context."
        highlightOpcodes: [LdaSmi, Star0, CreateFunctionContext, StaCurrentContextSlot]
        cases:
          - id: binding-bytecode-local-smi
            caseId: local-smi
            title: "Локальный незахваченный Smi"
            explanation: "`LdaSmi [42]` загружает immediate tagged value, а `Star0` пишет его в регистр Ignition `r0`. Это виртуальный регистр — слот frame, а не обязательно регистр CPU и не хранилище «внутри идентификатора»."
          - id: binding-bytecode-captured-smi
            caseId: captured-smi
            title: "Захваченный binding со Smi"
            explanation: "`CreateFunctionContext` создаёт Context для closure, затем `StaCurrentContextSlot [2]` пишет Smi в его слот. Слот находится в heap-объекте, но отдельный HeapNumber для `42` не нужен."
          - id: binding-bytecode-captured-symbol
            caseId: captured-symbol
            title: "Захваченный binding с Symbol"
            explanation: "Binding снова находится в слоте Context. После вызова `Symbol` в слот попадает tagged-указатель на отдельно созданный Symbol heap-объект."
      - id: values-v8-artifact
        type: representation
        artifactId: value-representations
        title: "Одна категория спецификации — разные представления V8"
        body: "Каждая вкладка воспроизводится через `%IsSmi` и `%DebugPrint` закреплённого Linux-бинарника. Адреса и нестабильные хеши объектов намеренно удалены."
        cases:
          - id: representation-smi
            caseId: smi
            title: "Небольшое целое Number"
            explanation: "`42` — значение Number и потому primitive value по ECMA-262. В этой сборке V8 оно представлено tagged-immediate `Smi`; Smi — устройство реализации, а не девятый тип языка."
          - id: representation-heap-number
            caseId: heap-number
            title: "Дробное Number"
            explanation: "`3.141592653589793` тоже является значением Number и потому primitive value, но здесь V8 использует `HeapNumber` и tagged-указатель. У одного типа языка может быть несколько представлений движка."
          - id: representation-string
            caseId: string
            title: "Значение String"
            explanation: "По стандарту литерал даёт неизменяемое значение String. В вашем d8-эксперименте `str1` и `str2` печатали один адрес INTERNALIZED_ONE_BYTE_STRING_TYPE; закреплённый capture тоже видит internalized heap String. Это переиспользование V8, а не передача переменной по ссылке и не гарантия ECMA-262."
          - id: representation-symbol
            caseId: symbol
            title: "Уникальное значение Symbol"
            explanation: "Этот Symbol является primitive value по ECMA-262, а V8 представляет его heap-объектом `SYMBOL_TYPE`. Категория спецификации и форма реализации отвечают на разные вопросы."
          - id: representation-bigint
            caseId: bigint
            title: "Значение BigInt"
            explanation: "В этом capture значение BigInt — то есть primitive value — представлено heap-объектом `BIG_INT_BASE_TYPE`: его целое произвольного размера не помещается в Smi."
      - id: values-performance-note
        type: note
        tone: implementation
        title: "Правило производительности: стабильные данные, затем замер"
        body: >-
          Smi обычно дёшев, но замена `const` или `let` на `var` не заставляет значение жить в stack
          и не обещает ускорение. Важны захват closure, escape analysis, feedback и активный уровень
          оптимизации. В горячем числовом коде стабилизируйте shapes и представления, измеряйте
          реальную нагрузку и проверяйте конкретную версию V8 — схема «примитив против ссылки» здесь
          ничего надёжного не предсказывает.
