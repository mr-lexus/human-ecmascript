id: values-types-memory-ru
slug: values-types-memory
locale: ru
translationOf: values-types-memory
sourceContentHash: ae2e9596b25684cb
title: "Значения, объекты и миф о ссылочных типах"
eyebrow: "Типы языка → поведение значений → представление в V8"
dek: >-
  Примитивные значения в JavaScript действительно есть. А вот отдельного «ссылочного типа»
  в списке типов языка нет. Разберёмся, почему общий объект — это не передача переменной по
  ссылке, почему integer не является типом JavaScript и чем плохи схемы «стек против кучи».
status: LOCALE_REVIEW
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 30
learningObjectives:
  - Назвать восемь типов языка ECMAScript и не путать их со служебными типами спецификации.
  - Объяснить присваивание и передачу аргументов без выдуманного «ссылочного типа».
  - Предсказать копирование примитивных значений, общий объект, неизменяемость строк и уникальность Symbol.
  - Отделить правила ECMA-262 от Smi, heap-объектов и оптимизированных представлений V8.
prerequisites:
  - Переменная хранит значение; сама переменная и хранимое значение — разные вещи.
  - Reference Record — служебная запись спецификации, которая появляется при вычислении выражений.
sections:
  - id: values-mental-model
    title: "Сначала разберитесь со значениями — память подождёт"
    mode: human
    blocks:
      - id: values-mental-model-prose
        type: prose
        body: >-
          ECMA-262 делит доступные JavaScript-коду значения на восемь типов: Undefined, Null,
          Boolean, String, Symbol, Number, BigInt и Object. Значения первых семи типов называются
          примитивными. Object стоит отдельно. Это классификация поведения программы, а не схема
          памяти: в ней ничего не сказано про стек, кучу, указатели или хранение «прямо на месте».
      - id: values-core-claims
        type: claims
        claims:
          - id: claim-language-types
            classification: NORMATIVE
            text: "Типы языка ECMAScript — Undefined, Null, Boolean, String, Symbol, Number, BigInt и Object. Значения всех типов, кроме Object, называются примитивными значениями."
            citationIds: [language-types, primitive-value-definition]
            sourceFingerprint: 7cad09a970ce4a31
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-no-reference-language-type
            classification: DERIVED
            text: "Типа языка с названием `reference` в этом списке нет. Reference Record относится к служебным типам спецификации; получить такую запись как значение в JavaScript-коде нельзя."
            citationIds: [language-types, reference-record]
            sourceFingerprint: 67cb5bfa268d443a
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-integer-is-number
            classification: NORMATIVE
            text: "Литерал `42` создаёт значение типа Number. Слово integer описывает целые числа и встречается в алгоритмах спецификации, но отдельного типа языка Integer нет. А `42n` — уже BigInt."
            citationIds: [language-types, number-type, bigint-type]
            sourceFingerprint: 875220aebf6d36a9
            confidence: 1
            reviewStatus: LOCALE_REVIEW
      - id: values-terminology-note
        type: note
        tone: insight
        title: "«Примитив» — разговорное сокращение"
        body: >-
          Если под «примитивом» имеют в виду primitive value, ничего страшного. Ошибка начинается,
          когда этому слову приписывают устройство памяти: «лежит в стеке», «не имеет адреса» —
          и для симметрии придумывают «ссылочный тип».
  - id: values-normative-model
    title: "Спецификация читает и записывает значения"
    mode: normative
    blocks:
      - id: values-normative-prose
        type: prose
        body: >-
          Во время вычисления имени или свойства спецификация временно использует Reference Record.
          Операция `GetValue` получает из этой записи обычное значение языка. Затем присваивание
          записывает значение в другую переменную или свойство. Если это значение Object, оба места
          могут вести к одному и тому же объекту. Придумывать для этого ещё один тип языка не нужно.
      - id: values-operation-map
        type: operations
        operations:
          - id: op-language-value
            name: ECMAScript language value
            kind: record
            summary: "Значение, принадлежащее одному из восьми типов языка."
            citationId: language-types
          - id: op-reference-record-value-topic
            name: Reference Record
            kind: record
            summary: "Служебная запись для найденной переменной или свойства."
            citationId: reference-record
          - id: op-get-value-value-topic
            name: GetValue
            kind: abstract-operation
            summary: "Получает из Reference Record значение, которое сейчас хранится в найденном месте."
            citationId: reference-record
          - id: op-function-instantiation-value-topic
            name: FunctionDeclarationInstantiation
            kind: runtime-semantics
            summary: "Создаёт параметры функции и инициализирует их значениями аргументов."
            citationId: function-instantiation
      - id: values-assignment-trace
        type: trace
        steps:
          - id: trace-evaluate-source
            label: "1. Вычислить правое выражение"
            operation: Evaluation
            detail: "Выражение вроде `source` сначала даёт Reference Record для найденной переменной."
            citationId: reference-record
          - id: trace-get-source-value
            label: "2. Прочитать значение"
            operation: GetValue
            detail: "GetValue получает хранимое значение: Number, String, Symbol, BigInt, Object или значение другого типа языка."
            citationId: reference-record
          - id: trace-evaluate-target
            label: "3. Найти место назначения"
            operation: Assignment evaluation
            detail: "Левая часть даёт Reference Record переменной или свойства, куда пойдёт результат."
            citationId: assignment-operators
          - id: trace-put-value
            label: "4. Записать полученное значение"
            operation: PutValue
            detail: "Присваивание записывает значение. Спецификация не переключается между режимами «копировать значение» и «передать ссылку» в зависимости от его типа."
            citationId: assignment-operators
          - id: trace-observe-identity
            label: "5. У объекта может быть два пути доступа"
            operation: Object value
            detail: "Если такое же значение Object уже хранится в другом месте, оба пути приводят к одному объекту. Но новое присваивание одной переменной по-прежнему меняет только её."
            citationId: object-type
      - id: values-normative-claims
        type: claims
        claims:
          - id: claim-assignment-copies-value
            classification: DERIVED
            text: "Присваивание получает значение языка из правого выражения и записывает его по Reference из левой части. В этих алгоритмах нет двух режимов — «по значению» для одних типов и «по ссылке» для других."
            citationIds: [assignment-operators, reference-record]
            sourceFingerprint: 07a6eab892028701
            confidence: 0.99
            reviewStatus: LOCALE_REVIEW
          - id: claim-parameters-receive-values
            classification: DERIVED
            text: "Параметр функции инициализируется значением соответствующего аргумента. Если присвоить параметру другое значение, переменная вызывающего кода не изменится."
            citationIds: [function-instantiation]
            sourceFingerprint: 36bedc4b87df13ea
            confidence: 0.99
            reviewStatus: LOCALE_REVIEW
          - id: claim-strings-immutable
            classification: NORMATIVE
            text: "Значение String — неизменяемая последовательность кодовых единиц UTF-16. Движок вправе переиспользовать или интернировать память строки, но для JavaScript это всё равно неизменяемое значение String."
            citationIds: [string-type]
            sourceFingerprint: 271250dc77ab3f67
            confidence: 1
            reviewStatus: LOCALE_REVIEW
  - id: values-observable-behavior
    title: "Общий объект виден, указатель — нет"
    mode: observable
    blocks:
      - id: values-observable-prose
        type: prose
        body: >-
          Код может проверить, получили ли два выражения один объект, и изменить этот объект через
          любой путь доступа. Но обычный JavaScript не умеет запросить адрес значения, узнать, лежит
          ли оно в стеке, или проверить, разделяют ли две одинаковые строки одну область памяти.
          Поэтому надёжная модель строится на значениях и идентичности, а не на воображаемых адресах.
      - id: values-observable-claims
        type: claims
        claims:
          - id: claim-primitive-reassignment-independent
            classification: OBSERVABLE
            text: "После `let b = a` присваивание нового примитивного значения в `b` не меняет `a`. У примитивного значения нет изменяемых свойств, через которые можно было бы заметить общую идентичность."
            citationIds: [language-types, assignment-operators]
            sourceFingerprint: edc13cd582940a08
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-object-aliasing
            classification: OBSERVABLE
            text: "Если две переменные содержат одно значение Object, изменение объекта через одну переменную видно через другую. Если одной переменной присвоить новый объект, вторая не переключится вслед за ней."
            citationIds: [object-type, assignment-operators]
            sourceFingerprint: fbcf042113f58e56
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-not-pass-by-reference
            classification: OBSERVABLE
            text: "Функция не может заменить переменную вызывающего кода простым присваиванием своему параметру. Зато она может изменить переданный объект: в начале вызова параметр и внешняя переменная содержат одно значение Object."
            citationIds: [function-instantiation, object-type]
            sourceFingerprint: 5fd8c31be7f6c4c0
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-symbol-identity
            classification: NORMATIVE
            text: "Каждый вызов `Symbol(description)` возвращает новое уникальное значение Symbol. Одинаковое описание не делает символы равными. При этом Symbol остаётся примитивным типом языка."
            citationIds: [symbol-type, symbol-constructor]
            sourceFingerprint: 241183623c85395f
            confidence: 1
            reviewStatus: LOCALE_REVIEW
      - id: values-observable-note
        type: note
        tone: warning
        title: "Фраза «объекты копируются по ссылке» только мешает"
        body: >-
          На простом примере с мутацией она будто бы работает, но плохо объясняет переназначение
          параметра и создаёт несуществующее значение-ссылку. Скажите точнее: «обе переменные содержат
          одно значение Object». Тогда различие между мутацией объекта и переназначением переменной
          становится очевидным.
  - id: values-v8-representation
    title: "Один примитив хранится сразу, другой — в heap"
    mode: v8
    blocks:
      - id: values-v8-prose
        type: prose
        body: >-
          У V8 есть несколько внутренних представлений JavaScript-значений. В закреплённой x64-сборке
          число `42` помещается в Smi: целая часть хранится прямо внутри tagged slot. А взятые для
          сравнения дробное число, строка, Symbol и BigInt представлены tagged-указателями на
          heap-объекты. Движок и оптимизатор могут менять это устройство, не меняя тип по ECMA-262.
      - id: values-v8-claims
        type: claims
        claims:
          - id: claim-v8-smi
            classification: V8_IMPLEMENTATION
            text: "В закреплённой x64-сборке V8 13.6 значение `42` имеет представление Smi: маленькое целое закодировано прямо в tagged value, отдельный HeapNumber для него не нужен."
            citationIds: [v8-pointer-compression, v8-smi-source]
            sourceFingerprint: bbf2378a03431130
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-v8-symbol-heap
            classification: V8_IMPLEMENTATION
            text: 'В том же capture `Symbol("guide")` — heap-объект с типом `SYMBOL_TYPE`. В исходниках V8 Symbol наследуется от Name, а Name — от PrimitiveHeapObject.'
            citationIds: [v8-symbol-source]
            sourceFingerprint: b10627869679eaf3
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-layout-not-language-type
            classification: DERIVED
            text: "Поэтому схема «примитив — это inline или stack, объект — это ссылка в heap» не может быть моделью типов ECMAScript: даже два примитивных значения в V8 представлены по-разному."
            citationIds: [language-types, v8-pointer-compression, v8-symbol-source]
            sourceFingerprint: ae193b5b1c8c74c4
            confidence: 1
            reviewStatus: LOCALE_REVIEW
          - id: claim-v8-optimized-representations
            classification: V8_IMPLEMENTATION
            text: "Оптимизирующие уровни V8 могут работать с распакованными числами и упаковать их обратно только при необходимости. По исходному объявлению нельзя однозначно нарисовать постоянное место в стеке или heap."
            citationIds: [v8-maglev]
            sourceFingerprint: f09b508effec5328
            confidence: 0.99
            reviewStatus: LOCALE_REVIEW
      - id: values-v8-artifact
        type: representation
        artifactId: value-representations
        title: "Одна категория стандарта — разные способы хранения в V8"
        body: "Каждая вкладка воспроизводится через `%IsSmi` и `%DebugPrint` закреплённого Linux-бинарника. Адреса и нестабильные хеши объектов намеренно удалены."
        cases:
          - id: representation-smi
            caseId: smi
            title: "Небольшое целое Number"
            explanation: "Для ECMA-262 значение `42` относится к примитивному типу Number. Эта сборка V8 хранит его как `Smi` прямо в tagged slot. Smi — внутреннее представление, а не девятый тип JavaScript."
          - id: representation-heap-number
            caseId: heap-number
            title: "Дробное Number"
            explanation: "`3.141592653589793` тоже относится к примитивному типу Number, но здесь V8 использует `HeapNumber` и tagged-указатель. У одного типа языка может быть несколько представлений движка."
          - id: representation-string
            caseId: string
            title: "Значение String"
            explanation: "По стандарту литерал создаёт неизменяемое значение String. V8 интернировал его как heap-объект; совместное хранение строки не делает её изменяемой или «ссылочной»."
          - id: representation-symbol
            caseId: symbol
            title: "Уникальное значение Symbol"
            explanation: "Symbol — примитивный тип языка, а этот Symbol в V8 представлен heap-объектом `SYMBOL_TYPE`. Это особенно наглядно ломает правило «примитив значит не heap»."
          - id: representation-bigint
            caseId: bigint
            title: "Значение BigInt"
            explanation: "В этом capture примитивное значение BigInt представлено heap-объектом `BIG_INT_BASE_TYPE`: его целое произвольного размера не помещается в Smi."
      - id: values-performance-note
        type: note
        tone: implementation
        title: "Правило производительности: стабильные данные, затем замер"
        body: >-
          Не выбирайте структуру программы по мифу «примитив против ссылки». В действительно горячих
          вычислениях важны стабильные представления, а для плотных числовых данных могут помочь
          TypedArray. Но V8 умеет распаковывать значения и удалять лишние аллокации. Решение принимают
          по профилю и реалистичному benchmark: слишком многое зависит от кода вокруг и версии движка.
