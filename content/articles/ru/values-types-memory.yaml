examples:
  - id: primitive-value-copy
    title: "Две независимые переменные с примитивными значениями"
    goal: "Проверить, что новое значение Number или String во второй переменной не меняет первую."
    sourcePath: examples/primitive-value-copy.js
    timeoutMs: 1200
    expectedOutput: ["7 7", "7 9", "hello hello", "hello goodbye"]
    claimIds: [claim-primitive-reassignment-independent, claim-assignment-copies-value]
    citationIds: [language-types, assignment-operators]
  - id: object-value-alias
    title: "Мутация объекта и новое присваивание"
    goal: "Отделить изменение общего объекта от записи другого объекта в одну переменную."
    sourcePath: examples/object-value-alias.js
    timeoutMs: 1200
    expectedOutput: ["2", "2 3"]
    claimIds: [claim-object-aliasing, claim-assignment-copies-value]
    citationIds: [object-type, assignment-operators]
  - id: argument-passing-values
    title: "Аргумент не передаёт переменную по ссылке"
    goal: "Сравнить присваивание параметру с мутацией общего значения Object."
    sourcePath: examples/argument-passing-values.js
    timeoutMs: 1200
    expectedOutput: ["1", "2"]
    claimIds: [claim-parameters-receive-values, claim-not-pass-by-reference]
    citationIds: [function-instantiation, object-type]
  - id: integer-is-number
    title: "Integer — не тип языка"
    goal: "Сравнить целочисленное значение Number со значением BigInt."
    sourcePath: examples/integer-is-number.js
    timeoutMs: 1200
    expectedOutput: ["number", "true", "bigint"]
    claimIds: [claim-integer-is-number]
    citationIds: [number-type, bigint-type]
  - id: symbol-identity
    title: "Описание Symbol не является его идентичностью"
    goal: "Создать два разных Symbol с одинаковым описанием и использовать оба как ключи свойств."
    sourcePath: examples/symbol-identity.js
    timeoutMs: 1200
    expectedOutput: ["false", "2"]
    claimIds: [claim-symbol-identity, claim-v8-symbol-heap]
    citationIds: [symbol-type, symbol-constructor, v8-symbol-source]
  - id: string-immutability
    title: "Внутреннее хранение не делает String изменяемым"
    goal: "Проверить, что запись по индексу не может изменить значение String."
    sourcePath: examples/string-immutability.js
    timeoutMs: 1200
    expectedOutput: ["TypeError", "cat"]
    claimIds: [claim-strings-immutable]
    citationIds: [string-type]
