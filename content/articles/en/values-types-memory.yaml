examples:
  - id: primitive-value-copy
    title: "Rebinding Number and String values"
    goal: "Observe that rebinding a Number or String does not change the value obtained from the first binding."
    sourcePath: examples/primitive-value-copy.js
    timeoutMs: 1200
    expectedOutput: ["7 7", "7 9", "hello hello", "hello goodbye"]
    claimIds: [claim-value-rebinding-independent, claim-assignment-transfers-value]
    citationIds: [language-types, assignment-operators]
  - id: object-value-alias
    title: "Mutation versus rebinding"
    goal: "Separate mutation of one shared Object from assigning a different Object to one binding."
    sourcePath: examples/object-value-alias.js
    timeoutMs: 1200
    expectedOutput: ["2", "2 3"]
    claimIds: [claim-object-aliasing, claim-assignment-transfers-value]
    citationIds: [object-type, assignment-operators]
  - id: argument-passing-values
    title: "An argument does not pass a variable by reference"
    goal: "Compare parameter reassignment with mutation through a shared Object value."
    sourcePath: examples/argument-passing-values.js
    timeoutMs: 1200
    expectedOutput: ["1", "2"]
    claimIds: [claim-parameters-receive-values, claim-not-pass-by-reference]
    citationIds: [function-instantiation, object-type]
  - id: integer-is-number
    title: "Integer is not a language type"
    goal: "Compare an integer-valued Number with a BigInt value."
    sourcePath: examples/integer-is-number.js
    timeoutMs: 1200
    expectedOutput: ["number", "true", "bigint"]
    claimIds: [claim-integer-is-number]
    citationIds: [number-type, bigint-type]
  - id: symbol-identity
    title: "A description is not Symbol identity"
    goal: "Create two distinct Symbol values with equal descriptions and use both as property keys."
    sourcePath: examples/symbol-identity.js
    timeoutMs: 1200
    expectedOutput: ["false", "2"]
    claimIds: [claim-symbol-identity, claim-v8-symbol-heap]
    citationIds: [symbol-type, symbol-constructor, v8-symbol-source]
  - id: string-immutability
    title: "String storage is not mutable identity"
    goal: "Observe that an indexed write cannot change a String value."
    sourcePath: examples/string-immutability.js
    timeoutMs: 1200
    expectedOutput: ["TypeError", "cat"]
    claimIds: [claim-strings-immutable]
    citationIds: [string-type]
  - id: value-binding-bytecode
    title: "Local and captured binding storage in V8"
    goal: "Compare an uncaptured local Smi with captured Smi and Symbol bindings."
    sourcePath: examples/value-binding-bytecode.js
    timeoutMs: 1200
    expectedOutput: ["42", "42", "symbol"]
    claimIds: [claim-v8-smi, claim-v8-binding-storage, claim-v8-symbol-heap]
    citationIds: [v8-pointer-compression, v8-ignition-frame, v8-symbol-source]
