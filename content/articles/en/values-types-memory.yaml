id: values-types-memory
slug: values-types-memory
locale: en
sourceContentHash: 7c00036ebf52c50e
title: "Primitive values, Reference Records, and actual storage"
eyebrow: "Specification vocabulary → name resolution → V8 storage"
dek: >-
  ECMA-262 defines the exact term primitive value; it does not define a standalone type named
  Primitive or a language type named reference. Follow an identifier through Environment Records
  and a Reference Record, then compare that semantic model with V8's Smi and heap representations.
status: TECH_REVIEW
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 34
learningObjectives:
  - Read an ECMAScript type as a set of values, not as a C++ storage declaration.
  - Use the exact term primitive value and distinguish language types from specification types.
  - Trace an identifier through ResolveBinding, Environment Records, a Reference Record, and GetValue.
  - Separate V8 binding locations from Smi, heap-object, and optimized value representations.
prerequisites:
  - An identifier, its binding, and the value obtained from that binding are different concepts.
  - ECMA-262 specifies observable semantics, not a required stack-and-heap layout.
sections:
  - id: values-mental-model
    title: "Begin with the vocabulary the specification actually defines"
    mode: human
    blocks:
      - id: values-mental-model-prose
        type: prose
        body: >-
          ECMA-262 defines a type as a set of data values. The eight ECMAScript language types are
          Undefined, Null, Boolean, String, Symbol, Number, BigInt, and Object. A primitive value is
          a member of one of the first seven sets. `primitive value` is the defined term; the standard
          does not introduce a separate language type named `Primitive`. None of these definitions
          decides whether an implementation uses a stack slot, a machine register, or a heap object.
      - id: values-core-claims
        type: claims
        claims:
          - id: claim-type-is-set
            classification: NORMATIVE
            text: "ECMA-262 defines a type as a set of data values. A language type therefore classifies values; it is not a declaration of their physical representation."
            citationIds: [type-definition, language-types]
            sourceFingerprint: d4667f472567921c
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-language-types
            classification: NORMATIVE
            text: "The ECMAScript language types are Undefined, Null, Boolean, String, Symbol, Number, BigInt, and Object. A primitive value is a member of Undefined, Null, Boolean, Number, BigInt, Symbol, or String."
            citationIds: [language-types, primitive-value-definition]
            sourceFingerprint: 7cad09a970ce4a31
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-no-primitive-type
            classification: DERIVED
            text: "`primitive value` is an exact specification term. The list of language types contains no standalone type named `Primitive`, so shortening the term to a noun must not be treated as another formal type or as a storage class."
            citationIds: [primitive-value-definition, language-types]
            sourceFingerprint: 2736b7f18ed084d3
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-no-reference-language-type
            classification: DERIVED
            text: "The language-type list also contains no type named `reference`. A Reference Record is instead a specification type used by algorithms and cannot be stored in an object property or language variable."
            citationIds: [language-types, specification-types, reference-record]
            sourceFingerprint: 67cb5bfa268d443a
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-integer-is-number
            classification: NORMATIVE
            text: "`42` is a Number value. “Integer” describes a mathematical subset and several specification operations, but it is not another ECMAScript language type; `42n` is a BigInt value."
            citationIds: [language-types, number-type, bigint-type]
            sourceFingerprint: 875220aebf6d36a9
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: values-terminology-note
        type: note
        tone: warning
        title: "Do not turn primitive value into a memory category"
        body: >-
          The informative note under the definition says a primitive value is represented directly
          at the lowest level of a language implementation. That is not a normative “lives on the
          stack” rule. In V8, one Number value may be a Smi while another Number, a String, a Symbol,
          or a BigInt can be represented by a heap object. The specification category stays the same.
  - id: values-normative-model
    title: "What happens when the program evaluates an identifier"
    mode: normative
    blocks:
      - id: values-normative-prose
        type: prose
        body: >-
          For `let target = source`, the identifier `source` does not evaluate straight to an address.
          Its runtime semantics call ResolveBinding. Starting from the running execution context's
          LexicalEnvironment, GetIdentifierReference asks each Environment Record whether it has the
          binding. When found, the algorithm creates a Reference Record whose [[Base]] is that
          Environment Record and whose [[ReferencedName]] is `source`. GetValue then calls the
          Environment Record's GetBindingValue method and obtains the ECMAScript language value.
      - id: values-operation-map
        type: operations
        operations:
          - id: op-environment-record-value-topic
            name: Environment Record
            kind: record
            summary: "A specification type that models identifier bindings and lexical nesting."
            citationId: environment-records
          - id: op-resolve-binding-value-topic
            name: ResolveBinding
            kind: abstract-operation
            summary: "Starts identifier resolution from the running execution context's LexicalEnvironment."
            citationId: resolve-binding
          - id: op-get-identifier-reference-value-topic
            name: GetIdentifierReference
            kind: abstract-operation
            summary: "Walks Environment Records and returns a Reference Record for the matching binding."
            citationId: get-identifier-reference
          - id: op-reference-record-value-topic
            name: Reference Record
            kind: record
            summary: "A specification value that identifies a resolved binding or property for later algorithms."
            citationId: reference-record
          - id: op-get-value-value-topic
            name: GetValue
            kind: abstract-operation
            summary: "For an Environment Record base, calls GetBindingValue and returns the language value."
            citationId: reference-record
      - id: values-assignment-trace
        type: trace
        steps:
          - id: trace-evaluate-source
            label: "1. Evaluate IdentifierReference `source`"
            operation: IdentifierReference Evaluation
            detail: "The grammar's runtime semantics return ? ResolveBinding(StringValue of `source`)."
            citationId: identifier-evaluation
          - id: trace-resolve-binding
            label: "2. Choose the starting lexical environment"
            operation: ResolveBinding
            detail: "ResolveBinding reads the running execution context's LexicalEnvironment and passes it to GetIdentifierReference."
            citationId: resolve-binding
          - id: trace-find-binding
            label: "3. Walk the Environment Record chain"
            operation: GetIdentifierReference
            detail: "HasBinding is checked on the current Environment Record; if it fails, [[OuterEnv]] is followed. A match creates the Reference Record."
            citationId: get-identifier-reference
          - id: trace-get-source-value
            label: "4. Obtain the language value"
            operation: GetValue
            detail: "Because [[Base]] is an Environment Record, GetValue invokes GetBindingValue with [[ReferencedName]] and [[Strict]]."
            citationId: reference-record
          - id: trace-evaluate-target
            label: "5. Initialize or assign the destination"
            operation: Assignment evaluation
            detail: "The destination's algorithm receives that language value. ECMA-262 says nothing here about copying bytes, pointers, stacks, or heaps."
            citationId: assignment-operators
      - id: values-normative-claims
        type: claims
        claims:
          - id: claim-reference-spec-artifact
            classification: NORMATIVE
            text: "Reference Record and Environment Record values are specification artefacts. Specification types do not necessarily correspond to implementation entities and cannot be stored in object properties or language variables."
            citationIds: [specification-types, reference-record, environment-records]
            sourceFingerprint: 0138fa96dbbfbb06
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-reference-not-pointer
            classification: DERIVED
            text: "A Reference Record is not a user-visible pointer or heap address. It is the specification's record-shaped input to algorithms such as GetValue, PutValue, and call evaluation."
            citationIds: [specification-types, reference-record]
            sourceFingerprint: 9b2abc96f6215bb2
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-assignment-transfers-value
            classification: DERIVED
            text: "Assignment obtains the right-hand ECMAScript language value and passes it to PutValue for the left-hand Reference Record. The algorithm defines no separate source-language modes called “copy by value” and “copy by reference”."
            citationIds: [assignment-operators, reference-record]
            sourceFingerprint: 07a6eab892028701
            confidence: 0.99
            reviewStatus: TECH_REVIEW
          - id: claim-parameters-receive-values
            classification: DERIVED
            text: "A parameter binding is initialized from the corresponding argument value. Assigning a different value to that parameter does not assign to the caller's binding."
            citationIds: [function-instantiation]
            sourceFingerprint: 36bedc4b87df13ea
            confidence: 0.99
            reviewStatus: TECH_REVIEW
          - id: claim-strings-immutable
            classification: NORMATIVE
            text: "A String value is an immutable ordered sequence of UTF-16 code units. An engine may share or intern its storage, but JavaScript still observes an immutable String value."
            citationIds: [string-type]
            sourceFingerprint: 271250dc77ab3f67
            confidence: 1
            reviewStatus: TECH_REVIEW
  - id: values-observable-behavior
    title: "What JavaScript can observe"
    mode: observable
    blocks:
      - id: values-observable-prose
        type: prose
        body: >-
          JavaScript can observe whether two expressions produce the same Object or the same Symbol,
          and it can observe mutation of an Object through another binding. It cannot ask for an
          address, query whether a binding uses a stack or heap slot, or detect whether two equal
          strings share backing storage. Those are implementation decisions, not language types.
      - id: values-observable-claims
        type: claims
        claims:
          - id: claim-value-rebinding-independent
            classification: OBSERVABLE
            text: "After `let b = a`, assigning a different Number or String value to `b` does not change the value obtained from `a`. This says nothing about the physical storage used for either binding."
            citationIds: [language-types, assignment-operators]
            sourceFingerprint: edc13cd582940a08
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-object-aliasing
            classification: OBSERVABLE
            text: "If two bindings contain the same Object value, mutation through one path is visible through the other. Reassigning one binding to a different Object does not redirect the other binding."
            citationIds: [object-type, assignment-operators]
            sourceFingerprint: fbcf042113f58e56
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-not-pass-by-reference
            classification: OBSERVABLE
            text: "A function cannot replace the caller's variable by assigning to its parameter. It can mutate an Object received as an argument because the parameter and caller initially hold the same Object value."
            citationIds: [function-instantiation, object-type]
            sourceFingerprint: 5fd8c31be7f6c4c0
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-symbol-identity
            classification: NORMATIVE
            text: "Each call to `Symbol(description)` returns a unique Symbol value. Symbol is one of the language types, and every Symbol value is a primitive value; the description is not its identity."
            citationIds: [symbol-type, symbol-constructor]
            sourceFingerprint: 241183623c85395f
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: values-observable-note
        type: note
        tone: warning
        title: "Object aliasing does not create a reference type"
        body: >-
          Two bindings can yield the same Object value. Mutating that Object is then visible through
          either path; rebinding one name does not redirect the other. This observable rule needs no
          C++ reference, no exposed pointer, and no additional ECMAScript language type.
  - id: values-v8-representation
    title: "V8 storage: value representation and binding location are separate"
    mode: v8
    blocks:
      - id: values-v8-prose
        type: prose
        body: >-
          In the pinned x64 V8 build, `42` fits the Smi tagged-immediate representation: V8 allocates
          no separate HeapNumber for that value. But “where `42` lives” is a different question. In
          Ignition, an uncaptured local can occupy a frame register; if a closure captures the binding,
          V8 creates a Context and writes the same Smi into a Context slot on the heap. A Symbol in
          that slot is instead a tagged pointer to a Symbol heap object. The declaration syntax alone
          therefore does not determine a permanent storage location.
      - id: values-v8-claims
        type: claims
        claims:
          - id: claim-v8-smi
            classification: V8_IMPLEMENTATION
            text: "In the pinned V8 13.6 x64 build, `42` is a Smi: the small integer payload is encoded directly in the tagged value rather than stored in a separate HeapNumber."
            citationIds: [v8-pointer-compression, v8-smi-source]
            sourceFingerprint: bbf2378a03431130
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-binding-storage
            classification: V8_IMPLEMENTATION
            text: "The pinned Ignition capture uses a frame register for the uncaptured local Smi, but CreateFunctionContext and StaCurrentContextSlot for captured bindings. A captured Smi has no separate number object even though its tagged bits reside in a heap Context slot."
            citationIds: [v8-ignition-frame, v8-pointer-compression]
            sourceFingerprint: 5d92dfbba4cd5039
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-string-internalization
            classification: V8_IMPLEMENTATION
            text: "Two bindings can contain a String value whose V8 slots point to the same internalized String object. That storage sharing is a V8 optimization; it is neither observable string identity nor pass-by-reference semantics in ECMAScript."
            citationIds: [string-type, v8-strings]
            sourceFingerprint: dc8bed6765990f12
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-symbol-heap
            classification: V8_IMPLEMENTATION
            text: 'The capture reports `Symbol("guide")` as a heap object with `SYMBOL_TYPE`. V8''s source declares Symbol as a Name, and Name extends PrimitiveHeapObject; a binding slot holds a tagged pointer to that object.'
            citationIds: [v8-symbol-source]
            sourceFingerprint: b10627869679eaf3
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-layout-not-language-type
            classification: DERIVED
            text: "Therefore primitive value cannot mean “inline or stack”: a Symbol value is a primitive value yet is a V8 heap object, while a captured Smi can be stored inside a heap Context without becoming a separate heap object."
            citationIds: [language-types, v8-pointer-compression, v8-symbol-source]
            sourceFingerprint: ae193b5b1c8c74c4
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-optimized-representations
            classification: V8_IMPLEMENTATION
            text: "Optimizing V8 tiers may operate on unboxed numeric representations and rebox only when necessary. Source-level declarations do not uniquely determine a permanent stack or heap layout."
            citationIds: [v8-maglev]
            sourceFingerprint: f09b508effec5328
            confidence: 0.99
            reviewStatus: TECH_REVIEW
      - id: values-v8-binding-bytecode
        type: bytecode
        artifactId: value-binding-storage
        title: "The binding decides the slot; the value decides what the slot contains"
        body: "Captured from the pinned Linux V8. Highlighted instructions show the local register path or creation and writing of a closure Context."
        highlightOpcodes: [LdaSmi, Star0, CreateFunctionContext, StaCurrentContextSlot]
        cases:
          - id: binding-bytecode-local-smi
            caseId: local-smi
            title: "Uncaptured Smi local"
            explanation: "`LdaSmi [42]` loads the immediate tagged value and `Star0` writes it to Ignition register `r0`. This virtual register is a frame slot, not necessarily a CPU register and not a property attached to the source identifier."
          - id: binding-bytecode-captured-smi
            caseId: captured-smi
            title: "Captured Smi binding"
            explanation: "`CreateFunctionContext` allocates the closure Context; `StaCurrentContextSlot [2]` writes the tagged Smi into its slot. The slot is in a heap object, but `42` still needs no separate HeapNumber."
          - id: binding-bytecode-captured-symbol
            caseId: captured-symbol
            title: "Captured Symbol binding"
            explanation: "The captured binding again uses a Context slot. After the `Symbol` call, that slot receives a tagged pointer to the separately allocated Symbol heap object."
      - id: values-v8-artifact
        type: representation
        artifactId: value-representations
        title: "One specification category, several V8 representations"
        body: "Each tab is reproduced with `%IsSmi` and `%DebugPrint` from the pinned Linux binary. Addresses and unstable object hashes are deliberately removed."
        cases:
          - id: representation-smi
            caseId: smi
            title: "Small integer Number"
            explanation: "`42` is a Number value and therefore a primitive value in ECMA-262. In this V8 build it is a tagged-immediate `Smi`; Smi is an implementation representation, not a ninth language type."
          - id: representation-heap-number
            caseId: heap-number
            title: "Decimal Number"
            explanation: "`3.141592653589793` is also a Number primitive value, but this capture uses a `HeapNumber` and a tagged pointer. One language type can have multiple engine representations."
          - id: representation-string
            caseId: string
            title: "String value"
            explanation: "The literal is an immutable String value by the standard. In the supplied d8 experiment, `str1` and `str2` printed the same INTERNALIZED_ONE_BYTE_STRING_TYPE address; the pinned capture also sees an internalized heap String. This is V8 storage reuse, not pass-by-reference or an ECMA-262 guarantee."
          - id: representation-symbol
            caseId: symbol
            title: "Unique Symbol value"
            explanation: "This Symbol is a primitive value by ECMA-262, while V8 represents it as a `SYMBOL_TYPE` heap object. Specification category and engine representation answer different questions."
          - id: representation-bigint
            caseId: bigint
            title: "BigInt value"
            explanation: "The BigInt primitive value is represented as a `BIG_INT_BASE_TYPE` heap object in this capture. Its arbitrary-size payload cannot fit in a Smi slot."
      - id: values-performance-note
        type: note
        tone: implementation
        title: "Performance rule: stabilize hot data, then measure"
        body: >-
          Smi is often cheap, but replacing `const` or `let` with `var` does not force values onto the
          stack and cannot promise a faster representation. Capture, escape analysis, feedback, and
          the optimizing tier matter. For hot numeric code, stabilize shapes and representations,
          benchmark the real workload, and inspect the active V8 version instead of optimizing from
          a “primitive versus reference” diagram.
