id: const-let-var
slug: const-let-var
locale: en
sourceContentHash: 228d0265dd83c418
title: "const, let, and var without folklore"
eyebrow: "Bindings → initialization → scope → performance"
dek: >-
  Choose a declaration for the semantics you need, not for a mythical speed boost.
  We will trace how each binding is created, explain the temporal dead zone, and show
  the narrow cases where `var` is still an intentional tool.
status: TECH_REVIEW
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 30
learningObjectives:
  - Explain the difference between creating, initializing, reading, and assigning a binding.
  - Predict block scope, function scope, the temporal dead zone, and loop closure behavior.
  - Choose `const`, `let`, or `var` without relying on performance folklore.
  - Read a pinned Ignition bytecode listing and identify a TDZ guard.
prerequisites:
  - A variable name resolves to a binding in an Environment Record.
  - An object and the binding that currently points to it are different things.
sections:
  - id: declaration-mental-model
    title: "Choose the lifetime of the binding"
    mode: human
    blocks:
      - id: declaration-mental-model-prose
        type: prose
        body: >-
          A declaration does more than reserve a name. It chooses where that name is visible,
          when it becomes readable, and whether the binding may later point to another value.
          Use `const` when the binding should keep the same value, `let` when reassignment is part
          of the algorithm, and `var` only when you deliberately want one function-scoped binding
          or must preserve legacy script behavior.
      - id: declaration-choice-claims
        type: claims
        claims:
          - id: claim-choice-rule
            classification: INFORMATIVE
            text: "A useful default is `const`; switch to `let` for an intentional reassignment, and use `var` only for intentional VariableEnvironment semantics or legacy compatibility."
            citationIds: [lexical-declarations, variable-statement]
            sourceFingerprint: e9f03e4511a1a741
            confidence: 0.98
            reviewStatus: TECH_REVIEW
          - id: claim-var-current
            classification: DERIVED
            text: "`var` is not deprecated: ES2026 defines VariableStatement as a current normative language construct with its own scope and initialization rules."
            citationIds: [variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: declaration-operation-map
        type: operations
        operations:
          - id: op-declarative-environment
            name: Declarative Environment Record
            kind: record
            summary: "Stores lexical bindings and whether each one is mutable and initialized."
            citationId: declarative-environment
          - id: op-create-mutable-binding
            name: CreateMutableBinding
            kind: abstract-operation
            summary: "Creates the uninitialized mutable binding used by `let`."
            citationId: declarative-environment
          - id: op-create-immutable-binding
            name: CreateImmutableBinding
            kind: abstract-operation
            summary: "Creates the uninitialized immutable binding used by `const`."
            citationId: declarative-environment
          - id: op-initialize-binding
            name: InitializeBinding
            kind: abstract-operation
            summary: "Gives an existing binding its first value and makes it readable."
            citationId: declarative-environment
      - id: declaration-choice-note
        type: note
        tone: insight
        title: "`const` protects the binding, not the object"
        body: >-
          `const settings = {}` prevents `settings = anotherObject`. It does not freeze
          `settings`: properties may still be added or changed. Use object immutability tools
          only when the object itself must be protected.
  - id: declaration-normative-trace
    title: "Creation happens before execution; initialization does not"
    mode: normative
    blocks:
      - id: declaration-normative-prose
        type: prose
        body: >-
          The familiar word “hoisting” compresses several different rules. Before a block or
          execution context runs, its declarations are collected and bindings are created.
          A `var` binding is initialized to `undefined` immediately. A `let` or `const` binding
          exists but remains uninitialized until evaluation reaches its declaration.
      - id: declaration-trace
        type: trace
        steps:
          - id: trace-collect-declarations
            label: "1. Collect declared names"
            operation: Scope analysis
            detail: "The surrounding script, function, or block determines the lexical and var-scoped declarations it contains."
            citationId: block-declaration-instantiation
          - id: trace-create-var
            label: "2. Create `var`"
            operation: VariableEnvironment
            detail: "Create one variable binding for the containing VariableEnvironment and initialize it to undefined."
            citationId: variable-statement
          - id: trace-create-lexical
            label: "3. Create `let` and `const`"
            operation: BlockDeclarationInstantiation
            detail: "Create mutable `let` bindings and immutable `const` bindings, both initially uninitialized."
            citationId: block-declaration-instantiation
          - id: trace-read-before-init
            label: "4. Reject an early read"
            operation: GetBindingValue
            detail: "Reading an uninitialized lexical binding throws ReferenceError. This interval is commonly called the TDZ."
            citationId: declarative-environment
          - id: trace-initialize
            label: "5. Evaluate the declaration"
            operation: InitializeBinding
            detail: "Evaluate the initializer, then give the binding its first value. A `let` without an initializer receives undefined here."
            citationId: lexical-declarations
          - id: trace-reassign
            label: "6. Handle later assignment"
            operation: SetMutableBinding
            detail: "A mutable `let` binding changes value; assignment to an immutable `const` binding throws TypeError."
            citationId: declarative-environment
      - id: declaration-normative-claims
        type: claims
        claims:
          - id: claim-tdz
            classification: NORMATIVE
            text: "A lexical binding is created before its declaration executes, but GetBindingValue throws ReferenceError while that binding is uninitialized."
            citationIds: [lexical-declarations, declarative-environment]
            sourceFingerprint: 41c21f2f3e905eed
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-branch-does-not-create-tdz
            classification: DERIVED
            text: "An `if` statement does not create a TDZ by itself. The enclosing lexical scope and declaration create the uninitialized interval; a branch only makes an early-read path possible."
            citationIds:
              [lexical-declarations, block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 9a6e8804e4c6c01f
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-early-read
            classification: NORMATIVE
            text: "An early read of a local `var` does not perform a TDZ check because its binding has already been initialized to `undefined`; that is different behavior, not merely a faster spelling of `let`."
            citationIds: [variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-const-binding
            classification: NORMATIVE
            text: "`const` creates an immutable binding; the specification does not make an object stored in that binding immutable."
            citationIds: [lexical-declarations, declarative-environment]
            sourceFingerprint: e9f03e4511a1a741
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-global-script
            classification: NORMATIVE
            text: "At the top level of a classic Script, `var` and lexical declarations use different parts of the Global Environment Record; in a Module, top-level `var` is module-scoped rather than a global-object property."
            citationIds: [global-declaration-instantiation, module-declaration-instantiation]
            sourceFingerprint: 6b7d20470512a09a
            confidence: 0.99
            reviewStatus: TECH_REVIEW
  - id: declaration-observable-cases
    title: "The differences you can actually observe"
    mode: observable
    blocks:
      - id: declaration-observable-prose
        type: prose
        body: >-
          Scope and initialization change program behavior. The examples contrast an early read,
          block visibility, object mutation through `const`, and loop closures. The final examples
          show a normal `const`/`let` combination, an intentional function-scoped `var`, and the
          exact branch fixture used for the bytecode capture—not a blanket recommendation to write
          new code with `var`.
      - id: declaration-observable-claims
        type: claims
        claims:
          - id: claim-block-scope
            classification: OBSERVABLE
            text: "A `var` declared inside an ordinary block remains visible in the containing function, while `let` and `const` do not escape that block."
            citationIds: [lexical-declarations, variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-loop-bindings
            classification: OBSERVABLE
            text: "A captured `let` loop variable has a distinct binding for each iteration; closures over a `var` loop variable share the function-scoped binding."
            citationIds: [create-per-iteration-environment, variable-statement]
            sourceFingerprint: 8f8f696aa7961cef
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: declaration-var-note
        type: note
        tone: warning
        title: "When `var` is the right tool"
        body: >-
          Keep `var` when maintaining code whose observable behavior depends on function scope,
          repeated declarations, or classic-script global integration. In new code, make that intent
          conspicuous—prefer declaring the `var` near the top of the function instead of hiding it
          inside a block. Never replace `let` with `var` when closures require a value per iteration.
  - id: declaration-performance
    title: "Performance: preserve semantics, then measure"
    mode: v8
    blocks:
      - id: declaration-performance-prose
        type: prose
        body: >-
          ECMA-262 specifies results, not which keyword must be faster. A TDZ check is not a pause;
          it is a guard against the engine's internal “uninitialized” value. Current V8 can emit such
          a guard where control flow requires it and also tracks proven checks so redundant ones can
          be removed. The specification's per-iteration Environment Records likewise do not prove
          that a physical object must be allocated when no closure observes it.
      - id: declaration-performance-claims
        type: claims
        claims:
          - id: claim-v8-hole-check
            classification: V8_IMPLEMENTATION
            text: "V8's bytecode generator implements initialization checks for lexical variables and contains explicit hole-check elision machinery."
            citationIds: [v8-hole-checks]
            sourceFingerprint: c5e65ad43b90fb47
            confidence: 0.97
            reviewStatus: TECH_REVIEW
          - id: claim-v8-bytecode-capture
            classification: V8_IMPLEMENTATION
            text: "In the pinned V8 13.6 capture, the unsafe `let` and `const` paths contain `LdaTheHole` and `ThrowReferenceErrorIfHole`; the `var`, initialized `let`, and initialized `const` fixtures contain no `ThrowReferenceErrorIfHole`."
            citationIds: [v8-hole-checks]
            sourceFingerprint: 8af584f5e91414c8
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-performance-no-guarantee
            classification: INFORMATIVE
            text: "There is no portable rule that `var`, `let`, or `const` is always faster; changing the declaration can also change scope, initialization, or closure semantics."
            citationIds:
              [lexical-declarations, variable-statement, create-per-iteration-environment]
            sourceFingerprint: 8f8f696aa7961cef
            confidence: 0.99
            reviewStatus: TECH_REVIEW
      - id: declaration-blazing-checklist
        type: trace
        steps:
          - id: blazing-preserve-semantics
            label: "1. Decide what an early read should mean"
            operation: Semantics first
            detail: "If it should be an error, keep the lexical declaration. If `undefined` before assignment is an intentional function-wide contract, `var` can express that contract."
            citationId: variable-statement
          - id: blazing-initialize-before-branch
            label: "2. Initialize before branching"
            operation: Remove the risky path
            detail: "Put `let value;` before the `if`, or compute every `const` value in its initializer. The captured V8 bytecode then needs no TDZ throw instruction for the later read."
            citationId: lexical-declarations
          - id: blazing-keep-scope-small
            label: "3. Keep the smallest correct scope"
            operation: Avoid semantic regressions
            detail: "Do not widen a block binding to the whole function merely to remove a guard. Wider scope can hide stale values and changes closure behavior."
            citationId: block-declaration-instantiation
          - id: blazing-measure-workload
            label: "4. Measure the optimized workload"
            operation: Benchmark last
            detail: "Warm up the complete hot function, preserve realistic branches and escapes, and compare every target engine. Ignition bytecode alone is not optimized machine-code performance."
      - id: declaration-bytecode-artifact
        type: bytecode
        artifactId: const-let-var-tdz
        title: "The TDZ guard in real V8 bytecode"
        body: "These five functions were captured from the same source file with a pinned Linux Node binary. Orange rows are the instructions that represent V8's uninitialized lexical sentinel and the possible ReferenceError."
        cases:
          - id: bytecode-var-branch
            caseId: var-across-branch
            title: "Early `var` read"
            explanation: "The register is already `undefined`. V8 can load and return it directly, so there is no hole guard—but the program silently returns `undefined`."
          - id: bytecode-let-branch
            caseId: let-across-branch
            title: "Early `let` read"
            explanation: "V8 initializes the register with its internal hole sentinel. The early branch loads it and executes `ThrowReferenceErrorIfHole`."
          - id: bytecode-const-branch
            caseId: const-across-branch
            title: "Early `const` read"
            explanation: "The TDZ mechanism is the same for `const`: the binding exists but remains the hole until its declaration initializes it."
          - id: bytecode-initialized-let
            caseId: initialized-let
            title: "Initialized `let` before `if`"
            explanation: "The declaration runs before the branch and writes `undefined`; subsequent reads need no `ThrowReferenceErrorIfHole`."
          - id: bytecode-initialized-const
            caseId: initialized-const
            title: "`const` initialized by an expression"
            explanation: "Both sides of the conditional produce the initializer value before the return. This capture contains neither a hole sentinel nor a TDZ throw."
      - id: declaration-performance-note
        type: note
        tone: implementation
        title: "A performance checklist that does not break the program"
        body: >-
          For blazing code, remove ambiguous control flow rather than weakening the declaration:
          initialize `let` before the branch and compute `const` in one expression. Use `var` when
          one function-wide binding that reads as `undefined` before assignment is deliberately the
          API of that function. Avoid unnecessary closures in hot loops, then benchmark the warmed-up
          workload on every target engine. A bytecode listing is evidence, not a universal style guide.
