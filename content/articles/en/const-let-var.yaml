id: const-let-var
slug: const-let-var
locale: en
sourceContentHash: 99bf12f258080168
title: "const, let, and var without folklore"
eyebrow: "Bindings → initialization → scope → performance"
dek: >-
  Choose a declaration for the semantics you need, not for a mythical speed boost.
  We will trace how each binding is created, explain the temporal dead zone, and identify
  the actual `var` rules—rather than invented best practices—that differ from lexical declarations.
status: TECH_REVIEW
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 38
learningObjectives:
  - Explain the difference between creating, initializing, reading, and assigning a binding.
  - Predict block scope, function scope, the temporal dead zone, and captured-binding behavior in loops.
  - Choose `const`, `let`, or `var` without relying on performance folklore.
  - Read a pinned Ignition bytecode listing and identify a TDZ guard.
prerequisites:
  - A variable name resolves to a binding in an Environment Record.
  - An object and the binding that currently points to it are different things.
sections:
  - id: declaration-mental-model
    title: "Choose the lifetime of the binding"
    mode: human
    blocks:
      - id: declaration-mental-model-prose
        type: prose
        body: >-
          A declaration does more than reserve a name. It chooses where that name is visible,
          when it becomes readable, and whether the binding may later point to another value.
          Use `const` when the binding should keep the same value, `let` when reassignment is part
          of the algorithm. `var` is not shorthand for “one binding for the whole function”; a
          `let` in the function body can express that explicitly. Choose `var` only when its
          observable VariableEnvironment rules are themselves required.
      - id: declaration-choice-claims
        type: claims
        claims:
          - id: claim-choice-rule
            classification: INFORMATIVE
            text: "A practical rule for new code is `const` without reassignment and `let` with reassignment. Use `var` only when its differences are part of the contract: an early undefined value, no ordinary-block scope, merged repeated declarations, or classic-Script global declaration behavior."
            citationIds:
              [lexical-declarations, variable-statement, global-declaration-instantiation]
            sourceFingerprint: e9f03e4511a1a741
            confidence: 0.98
            reviewStatus: TECH_REVIEW
          - id: claim-var-current
            classification: DERIVED
            text: "`var` is not deprecated: ES2026 defines VariableStatement as a current normative language construct with its own scope and initialization rules."
            citationIds: [variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: declaration-operation-map
        type: operations
        operations:
          - id: op-declarative-environment
            name: Declarative Environment Record
            kind: record
            summary: "Stores lexical bindings and whether each one is mutable and initialized."
            citationId: declarative-environment
          - id: op-create-mutable-binding
            name: CreateMutableBinding
            kind: abstract-operation
            summary: "Creates the uninitialized mutable binding used by `let`."
            citationId: declarative-environment
          - id: op-create-immutable-binding
            name: CreateImmutableBinding
            kind: abstract-operation
            summary: "Creates the uninitialized immutable binding used by `const`."
            citationId: declarative-environment
          - id: op-initialize-binding
            name: InitializeBinding
            kind: abstract-operation
            summary: "Gives an existing binding its first value and makes it readable."
            citationId: declarative-environment
      - id: declaration-choice-note
        type: note
        tone: insight
        title: "`const` protects the binding, not the object"
        body: >-
          `const settings = {}` prevents `settings = anotherObject`. It does not freeze
          `settings`: properties may still be added or changed. Use object immutability tools
          only when the object itself must be protected.
      - id: declaration-keyword-decision-guide
        type: trace
        steps:
          - id: choose-const
            label: "`const`: initialize now and do not reassign"
            operation: Stable binding
            detail: "Use it for dependencies, configuration, and intermediate results: `const config = loadConfig()`. It fixes the name-to-value association but does not freeze an object. The keyword itself provides no performance guarantee."
            citationId: lexical-declarations
          - id: choose-let
            label: "`let`: one local binding is meant to change"
            operation: Mutable local
            detail: "Use it for a counter, cursor, or accumulator: `let total = 0; total += price`. Initialize it before branching and keep it in the narrowest block that actually needs it."
            citationId: lexical-declarations
          - id: choose-var
            label: "`var`: the VariableEnvironment semantics are required"
            operation: Specialized contract
            detail: "In an ordinary function, a var binding is created and initialized to `undefined` before statements execute; an `if` or ordinary `{}` does not create a new var scope, and repeated declarations denote the same binding. If you only need a shared mutable function local, declare `let` before the branches. Choose `var` only when the listed differences are requirements."
            citationId: variable-statement
          - id: reject-keyword-speed-hack
            label: "Do not choose a keyword from one bytecode instruction"
            operation: Sanity check
            detail: "In the fixture that reads before lexical initialization, replacing `let` with `var` removes the TDZ by changing behavior. This is not a universal transformation. If `undefined` would be a bug, fix initialization order or block structure instead. Correctly initialized `let` and `const` can also need no `ThrowReferenceErrorIfHole`; benchmark optimized hot code before making a performance claim."
            citationId: v8-hole-checks
  - id: declaration-normative-trace
    title: "Creation happens before execution; initialization does not"
    mode: normative
    blocks:
      - id: declaration-normative-prose
        type: prose
        body: >-
          The familiar word “hoisting” compresses several different rules. Before a block or
          execution context runs, its declarations are collected and bindings are created.
          A `var` binding is initialized to `undefined` immediately. A `let` or `const` binding
          exists but remains uninitialized until evaluation reaches its declaration.
      - id: declaration-trace
        type: trace
        steps:
          - id: trace-collect-declarations
            label: "1. Collect declared names"
            operation: Scope analysis
            detail: "The surrounding script, function, or block determines the lexical and var-scoped declarations it contains."
            citationId: block-declaration-instantiation
          - id: trace-create-var
            label: "2. Create `var`"
            operation: VariableEnvironment
            detail: "Create one variable binding for the containing VariableEnvironment and initialize it to undefined."
            citationId: variable-statement
          - id: trace-create-lexical
            label: "3. Create `let` and `const`"
            operation: BlockDeclarationInstantiation
            detail: "Create mutable `let` bindings and immutable `const` bindings, both initially uninitialized."
            citationId: block-declaration-instantiation
          - id: trace-read-before-init
            label: "4. Reject an early read"
            operation: GetBindingValue
            detail: "Reading an uninitialized lexical binding throws ReferenceError. This interval is commonly called the TDZ."
            citationId: declarative-environment
          - id: trace-initialize
            label: "5. Evaluate the declaration"
            operation: InitializeBinding
            detail: "Evaluate the initializer, then give the binding its first value. A `let` without an initializer receives undefined here."
            citationId: lexical-declarations
          - id: trace-reassign
            label: "6. Handle later assignment"
            operation: SetMutableBinding
            detail: "A mutable `let` binding changes value; assignment to an immutable `const` binding throws TypeError."
            citationId: declarative-environment
      - id: declaration-normative-claims
        type: claims
        claims:
          - id: claim-tdz
            classification: NORMATIVE
            text: "A lexical binding is created before its declaration executes, but GetBindingValue throws ReferenceError while that binding is uninitialized."
            citationIds: [lexical-declarations, declarative-environment]
            sourceFingerprint: 41c21f2f3e905eed
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-branch-does-not-create-tdz
            classification: DERIVED
            text: "An `if` statement does not create a TDZ by itself. The enclosing lexical scope and declaration create the uninitialized interval; a branch only makes an early-read path possible."
            citationIds:
              [lexical-declarations, block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 9a6e8804e4c6c01f
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-early-read
            classification: NORMATIVE
            text: "An early read of a local `var` does not perform a TDZ check because its binding has already been initialized to `undefined`; that is different behavior, not merely a faster spelling of `let`."
            citationIds: [variable-statement]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-variable-environment-not-storage
            classification: DERIVED
            text: "VariableEnvironment is a specification-model component, not a promise of a physical object or heap allocation. In V8, ordinary var/let/const locals may live in interpreter-frame virtual registers, while captured bindings may use a Context; the `var` keyword alone does not determine storage."
            citationIds: [execution-context-variable-environment, v8-sparkplug, v8-preparser]
            sourceFingerprint: 6db1debd74c4b9fd
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-const-binding
            classification: NORMATIVE
            text: "`const` creates an immutable binding; the specification does not make an object stored in that binding immutable."
            citationIds: [lexical-declarations, declarative-environment]
            sourceFingerprint: e9f03e4511a1a741
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-global-script
            classification: NORMATIVE
            text: "At the top level of a classic Script, `var` and lexical declarations use different parts of the Global Environment Record; in a Module, top-level `var` is module-scoped rather than a global-object property."
            citationIds: [global-declaration-instantiation, module-declaration-instantiation]
            sourceFingerprint: 6b7d20470512a09a
            confidence: 0.99
            reviewStatus: TECH_REVIEW
  - id: declaration-observable-cases
    title: "The differences you can actually observe"
    mode: observable
    blocks:
      - id: declaration-observable-prose
        type: prose
        body: >-
          Scope and initialization change program behavior. The examples contrast an early read,
          block visibility, object mutation through `const`, and functions that retain access to
          loop bindings. A separate example compares `var` declarations inside branches with a
          `let` declared before those same branches; their results match for these inputs. Merely
          needing one result binding therefore does not make `var` necessary.
      - id: declaration-observable-claims
        type: claims
        claims:
          - id: claim-block-scope
            classification: OBSERVABLE
            text: "In an ordinary function body, a `var` declared inside an `if` or ordinary `{}` belongs to that function's VariableEnvironment and remains accessible after the block. This does not make every var declaration 'function-scoped': outside an ordinary function, Script, Module, and a static initialization block use their own instantiation algorithms."
            citationIds:
              [
                lexical-declarations,
                variable-statement,
                execution-context-variable-environment,
                global-declaration-instantiation,
                module-declaration-instantiation,
                class-static-block,
              ]
            sourceFingerprint: 4eb34a6c87a16d01
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-loop-bindings
            classification: OBSERVABLE
            text: "A function created in a `for (let ...)` iteration observes that iteration's distinct binding; functions created by a `for (var ...)` loop share one binding from the surrounding VariableEnvironment."
            citationIds: [create-per-iteration-environment, variable-statement]
            sourceFingerprint: 8f8f696aa7961cef
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-let-branch-equivalence
            classification: OBSERVABLE
            text: "In the comparison example, the branch-local `var` version and the `let result;`-before-branches version return the same strings. They match because the `let` statement executes before any read and both functions assign the same branch values; this does not make `var` and `let` generally interchangeable."
            citationIds: [lexical-declarations, variable-statement]
            sourceFingerprint: ef66a654ef921ff4
            confidence: 1
            reviewStatus: TECH_REVIEW
      - id: declaration-var-note
        type: note
        tone: warning
        title: "What must justify choosing `var`"
        body: >-
          There is no magical everyday scenario in which `var` is automatically more correct or
          faster. It is justified when code must observably depend on one of its rules: reading
          before the textual declaration yields `undefined`; an ordinary block does not limit its
          scope; repeated `var` declarations merge into one binding; or a top-level declaration in
          a classic Script participates in the Global Environment differently from `let`. These
          needs appear in compatibility work, code generators, and classic Scripts that observe a
          global var declaration's relationship to the global object. If you only need one mutable
          function local, a `let` in the function body says so directly. Do not replace `let` with
          `var` when closures need a distinct binding per iteration.
  - id: declaration-performance
    title: "Performance: preserve semantics, then measure"
    mode: v8
    blocks:
      - id: declaration-performance-prose
        type: prose
        body: >-
          ECMA-262 specifies results, not which keyword must be faster. A TDZ check is not a pause;
          it is a guard against the engine's internal “uninitialized” value. Current V8 can emit such
          a guard where control flow requires it and also tracks proven checks so redundant ones can
          be removed. The specification's per-iteration Environment Records likewise do not prove
          that a physical object must be allocated when no closure observes it.
      - id: declaration-performance-claims
        type: claims
        claims:
          - id: claim-v8-hole-check
            classification: V8_IMPLEMENTATION
            text: "V8's bytecode generator implements initialization checks for lexical variables and contains explicit hole-check elision machinery."
            citationIds: [v8-hole-checks]
            sourceFingerprint: c5e65ad43b90fb47
            confidence: 0.97
            reviewStatus: TECH_REVIEW
          - id: claim-shadowed-binding-tdz
            classification: DERIVED
            text: "In a block containing `let p2`, every `p2` reference in that block resolves to the inner lexical binding, including references textually before the declaration. `p2 = 7` therefore reaches the uninitialized inner binding and throws ReferenceError instead of assigning the outer `p2`."
            citationIds: [block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 6ab2d8b76ed13fe1
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-shadowing-not-nesting
            classification: DERIVED
            text: "Entering a nested block does not itself create a TDZ for an outer binding. The risk appears when that block declares a same-named `let` or `const`: the new binding shadows the outer one throughout the block and any access before initialization must fail."
            citationIds: [block-declaration-instantiation, declarative-environment]
            sourceFingerprint: 6ab2d8b76ed13fe1
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-bytecode-capture
            classification: V8_IMPLEMENTATION
            text: "In the pinned V8 13.6 capture, early access to a shadowing `let` or `const` contains `LdaTheHole` and `ThrowReferenceErrorIfHole`. A nested block without redeclaration and the initialize-first `let`/`const` pairs contain no such guard."
            citationIds: [v8-hole-checks]
            sourceFingerprint: 8af584f5e91414c8
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-var-let-baseline-comparison
            classification: V8_IMPLEMENTATION
            text: "In the pinned V8 13.6 capture, a function with `var result` in its branches and a function with `let result` before the same branches return the same values and contain no hole check. The `var` baseline bytecode is 25 bytes and 13 instructions; the `let` version is 27 bytes and 15 instructions because `let result;` emits `LdaUndefined` and `Star0`. This is an Ignition observation for this version, not an optimized-performance guarantee."
            citationIds: [lexical-declarations, variable-statement, v8-hole-checks, v8-sparkplug]
            sourceFingerprint: ea9a7eabdf92cad5
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-nesting-no-runtime-scan
            classification: V8_IMPLEMENTATION
            text: "In the pinned V8 13.6 capture, the same-function `let` and `var` fixtures have byte-identical opcode sequences. Nested `if` statements and a loop do not make V8 search a chain of block scopes on every local read."
            citationIds: [v8-sparkplug]
            sourceFingerprint: 9737b5e27328fcb3
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-function-environment
            classification: NORMATIVE
            text: "An ECMAScript function object stores an Environment Record in `[[Environment]]`. On a call, the new Function Environment Record uses that stored record as its `[[OuterEnv]]`; this is the specification mechanism behind a function retaining access to outer bindings."
            citationIds: [function-objects, new-function-environment]
            sourceFingerprint: 529cc80af215a6c0
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-closure-terminology
            classification: DERIVED
            text: "The common term ‘JavaScript closure’ refers to a Function Object retaining its lexical environment. It is not the same thing as ECMA-262's `Abstract Closure` specification type, and HTML callback scheduling does not replace the function's `[[Environment]]`."
            citationIds: [function-objects, abstract-closure, html-job-callback]
            sourceFingerprint: 85f0cde66da089d9
            confidence: 1
            reviewStatus: TECH_REVIEW
          - id: claim-v8-captured-context
            classification: V8_IMPLEMENTATION
            text: "When an inner function uses an outer local, V8 may place that local in a heap-allocated Context. This applies to captured `let` and captured `var`; it is capture, not the declaration keyword alone, that changes the storage path."
            citationIds: [v8-preparser]
            sourceFingerprint: fa3faedd8027fe59
            confidence: 0.99
            reviewStatus: TECH_REVIEW
          - id: claim-v8-context-optimization
            classification: V8_IMPLEMENTATION
            text: "Ignition context bytecodes are not a final performance verdict: V8's optimizing pipeline includes context specialization that can fold context loads and simplify context stores when its assumptions hold."
            citationIds: [v8-context-specialization]
            sourceFingerprint: a7424eae641393b4
            confidence: 0.98
            reviewStatus: TECH_REVIEW
          - id: claim-performance-no-guarantee
            classification: INFORMATIVE
            text: "There is no portable rule that `var`, `let`, or `const` is always faster; changing the declaration can also change scope, initialization, or closure semantics."
            citationIds:
              [lexical-declarations, variable-statement, create-per-iteration-environment]
            sourceFingerprint: 8f8f696aa7961cef
            confidence: 0.99
            reviewStatus: TECH_REVIEW
      - id: declaration-blazing-checklist
        type: trace
        steps:
          - id: blazing-preserve-semantics
            label: "1. Decide what an early read should mean"
            operation: Semantics first
            detail: "Keep a lexical declaration if an early access should fail. If it must yield `undefined` even before the textual declaration, that is a specific `var` rule. When no early read exists, this difference is not a reason to choose a keyword."
            citationId: variable-statement
          - id: blazing-initialize-before-branch
            label: "2. Initialize before branching"
            operation: Remove the risky path
            detail: "Put `let value;` before the `if`, or compute every `const` value in its initializer. The captured V8 bytecode then needs no TDZ throw instruction for the later read."
            citationId: lexical-declarations
          - id: blazing-keep-scope-small
            label: "3. Keep the smallest correct scope"
            operation: Avoid semantic regressions
            detail: "Do not widen a block binding to the whole function merely to remove a guard. Wider scope can hide stale values and changes closure behavior."
            citationId: block-declaration-instantiation
          - id: blazing-measure-workload
            label: "4. Measure the optimized workload"
            operation: Benchmark last
            detail: "Warm up the complete hot function, preserve realistic branches and escapes, and compare every target engine. Ignition bytecode alone is not optimized machine-code performance."
      - id: declaration-shadowing-guidance-note
        type: note
        tone: insight
        title: "Practical rule for `let` and `const` in nested blocks"
        body: >-
          Keep a binding in the smallest block that correctly describes its lifetime. Descending
          into another block is safe: if that block does not redeclare the name, references continue
          to resolve to the initialized outer binding. If you intentionally reuse the name with
          `let` or `const`, initialize the new binding before every read or write. Otherwise the
          inner declaration shadows the outer binding from the start of the block and creates a TDZ
          path. Renaming the inner binding is often clearer than replacing it with function-scoped
          `var`, which would change the program's semantics.
      - id: declaration-intentional-var-note
        type: note
        tone: implementation
        title: "What `var` changes in the comparison fixture"
        body: >-
          The two functions below behave alike for every tested input. In the first, repeated
          `var result` declarations in branches denote one VariableEnvironment binding. In the
          second, `let result;` explicitly executes before the branches. Neither contains a hole
          check. In the pinned Ignition capture, the `var` version omits `LdaUndefined` and `Star0`
          because its binding was initialized while the environment was created; the `let result;`
          statement must execute at its source position. This is an honest baseline-bytecode fact,
          not a promise about hot optimized code. Explicit `let` is usually clearer in ordinary
          application code; `var` makes sense only when its rules are required or a relevant effect
          has been measured on the target runtime.
      - id: declaration-bytecode-artifact
        type: bytecode
        artifactId: const-let-var-tdz
        title: "The TDZ guard in real V8 bytecode"
        body: "These twelve functions were captured from the same source file with a pinned Linux Node binary. Orange rows are the instructions that represent V8's uninitialized lexical sentinel and the possible ReferenceError."
        cases:
          - id: bytecode-var-branch
            caseId: var-across-branch
            title: "Early `var` read"
            explanation: "The register is already `undefined`. V8 can load and return it directly, so there is no hole guard—but the program silently returns `undefined`."
          - id: bytecode-let-branch
            caseId: let-across-branch
            title: "Early `let` read"
            explanation: "V8 initializes the register with its internal hole sentinel. The early branch loads it and executes `ThrowReferenceErrorIfHole`."
          - id: bytecode-const-branch
            caseId: const-across-branch
            title: "Early `const` read"
            explanation: "The TDZ mechanism is the same for `const`: the binding exists but remains the hole until its declaration initializes it."
          - id: bytecode-initialized-let
            caseId: initialized-let
            title: "Initialized `let` before `if`"
            explanation: "The declaration runs before the branch and writes `undefined`; subsequent reads need no `ThrowReferenceErrorIfHole`."
          - id: bytecode-initialized-const
            caseId: initialized-const
            title: "`const` initialized by an expression"
            explanation: "Both sides of the conditional produce the initializer value before the return. This capture contains neither a hole sentinel nor a TDZ throw."
          - id: bytecode-shadowed-let-before-declaration
            caseId: shadowed-let-before-declaration
            title: "Assignment before shadowing `let`"
            explanation: "The inner `p2` shadows the outer one from the beginning of the block. V8 stores the hole in `r2`; `p2 = 7` first checks that inner binding and throws before the assignment can happen."
          - id: bytecode-initialized-shadowed-let
            caseId: initialized-shadowed-let
            title: "Shadowing `let` initialized first"
            explanation: "Moving `let p2;` before `p2 = 7` initializes the inner binding with `undefined`. The function returns `12`, and this capture contains no hole guard."
          - id: bytecode-nested-without-shadowing
            caseId: nested-without-shadowing
            title: "Nested block without redeclaration"
            explanation: "The inner block assigns and reads the already initialized outer `p2`. This capture is only 8 bytes and contains neither `LdaTheHole` nor `ThrowReferenceErrorIfHole`."
          - id: bytecode-shadowed-const-before-declaration
            caseId: shadowed-const-before-declaration
            title: "Read before shadowing `const`"
            explanation: "The inner `const p2` shadows the outer constant throughout the block. Reading `p2` above the declaration therefore executes `ThrowReferenceErrorIfHole`."
          - id: bytecode-initialized-shadowed-const
            caseId: initialized-shadowed-const
            title: "Shadowing `const` initialized first"
            explanation: "Placing `const p2 = 7` before the read preserves intentional shadowing while removing the TDZ path and its hole guard in this capture."
          - id: bytecode-intentional-function-var
            caseId: intentional-function-var
            title: "`var result` inside several branches"
            explanation: "Both branches assign one VariableEnvironment binding. There is no hole check. In this capture the function is 25 bytes and 13 instructions."
          - id: bytecode-intentional-function-let
            caseId: intentional-function-let
            title: "Equivalent `let result` before the branches"
            explanation: "Results match the `var` version and there is still no hole check. Executing `let result;` adds `LdaUndefined` and `Star0`: 27 bytes and 15 instructions here."
      - id: declaration-nesting-bytecode-artifact
        type: bytecode
        artifactId: const-let-var-nesting
        title: "Nested blocks, captured bindings, and loop environments"
        body: "This capture separates three cases that are often conflated: ordinary local reads, an outer binding used by an inner function, and a loop binding observed after its iteration. Bytecode length describes this pinned Ignition baseline only; it is not a timing benchmark."
        cases:
          - id: bytecode-nested-let-read
            caseId: nested-let-read
            title: "Nested local read with `let`"
            explanation: "The local stays in an interpreter virtual register. The nested loop and `if` statements add control flow, not a runtime lexical-environment search."
          - id: bytecode-nested-var-read
            caseId: nested-var-read
            title: "Nested local read with `var`"
            explanation: "This fixture has the same 39-byte opcode sequence as the `let` version. There is no keyword-only advantage in this case."
          - id: bytecode-make-captured-let
            caseId: make-captured-let
            title: "Create a function that uses outer `let`"
            explanation: "V8 creates a Function Context and stores the lexical binding there. The hole initialization belongs to `let` initialization semantics."
          - id: bytecode-make-captured-var
            caseId: make-captured-var
            title: "Create a function that uses outer `var`"
            explanation: "V8 also creates a Function Context for captured `var`. It does not need the lexical hole initialization."
          - id: bytecode-read-captured-let
            caseId: read-captured-let
            title: "Read captured `let`"
            explanation: "The inner function loads a Context slot and retains a TDZ guard in this baseline bytecode."
          - id: bytecode-read-captured-var
            caseId: read-captured-var
            title: "Read captured `var`"
            explanation: "The inner function loads its Context slot without a TDZ guard because the var binding was initialized to `undefined` during instantiation."
          - id: bytecode-captured-loop-let
            caseId: captured-loop-let
            title: "Captured `for (let ...)` binding"
            explanation: "`CreateBlockContext` implements the observable per-iteration binding: the readers later return `0,1,2`. This is real extra baseline work required by different semantics."
          - id: bytecode-captured-loop-var
            caseId: captured-loop-var
            title: "Captured `for (var ...)` binding"
            explanation: "One Function Context holds the shared binding, so every reader later observes `3`. This is not an equivalent faster rewrite of the `let` program."
      - id: declaration-closure-terminology-note
        type: note
        tone: insight
        title: "What “closure” means here"
        body: >-
          ECMA-262 does not define a JavaScript language type named `Closure`. It describes an
          ECMAScript Function Object as code closed over a lexical environment and stores that
          Environment Record in `[[Environment]]`. The separate `Abstract Closure` specification
          type is a meta-value used inside specification algorithms, not a value created by a
          JavaScript function expression. HTML does not rebuild the lexical environment when a
          timer, event, or job runs: its host algorithms restore browser-specific callback state
          and then invoke the stored function through ECMA-262's `Call` operation.
      - id: declaration-performance-note
        type: note
        tone: implementation
        title: "What the `theSum` example actually proves"
        body: >-
          V8 is not confused by the two `p2` declarations. Scope analysis resolves the assignment
          to the inner binding before execution; the hole records that this already-resolved binding
          is still uninitialized. The original function is therefore an erroneous TDZ path, not a
          duplicate-name search and not a benchmark showing that `let` is generally slow. Put the
          inner `let p2;` before `p2 = 7` and the function returns `12`
          without a hole guard in this V8 capture. Replacing it with `var` also removes block
          shadowing, but changes the program to one function-wide binding; use that only when those
          semantics are intentional. Instruction count in Ignition is evidence about this cold
          baseline path, not a portable measurement of optimized-code performance.
