examples:
  - id: declaration-tdz
    title: "TDZ versus `var` initialization"
    goal: "Compare an early lexical read with a var binding initialized to undefined."
    sourcePath: examples/declaration-tdz.js
    timeoutMs: 1200
    expectedOutput: ["ReferenceError", "undefined"]
    claimIds: [claim-tdz, claim-var-current]
    citationIds: [lexical-declarations, variable-statement, declarative-environment]
  - id: declaration-block-scope
    title: "Block scope and function scope"
    goal: "Observe which declarations remain visible after an ordinary block ends."
    sourcePath: examples/declaration-block-scope.js
    timeoutMs: 1200
    expectedOutput:
      [
        "let stays in the block / const stays in the block",
        "var survives the block",
        "ReferenceError",
      ]
    claimIds: [claim-block-scope]
    citationIds: [lexical-declarations, variable-statement]
  - id: const-object-mutation
    title: "A fixed binding to a mutable object"
    goal: "Separate changing object properties from assigning a different value to a const binding."
    sourcePath: examples/const-object-mutation.js
    timeoutMs: 1200
    expectedOutput: ["1", "TypeError"]
    claimIds: [claim-const-binding]
    citationIds: [lexical-declarations, declarative-environment]
  - id: loop-bindings
    title: "Loop bindings captured by closures"
    goal: "Compare one binding per iteration with a single shared var binding."
    sourcePath: examples/loop-bindings.js
    timeoutMs: 1200
    expectedOutput: ["0,1,2", "3,3,3"]
    claimIds: [claim-loop-bindings]
    citationIds: [create-per-iteration-environment, variable-statement]
  - id: intentional-var-scope
    title: "An intentional function-scoped `var`"
    goal: "Show repeated var declarations contributing to one binding across branches."
    sourcePath: examples/intentional-var-scope.js
    timeoutMs: 1200
    expectedOutput: ["cached value", "network value", "no value"]
    claimIds: [claim-var-current, claim-block-scope]
    citationIds: [variable-statement]
  - id: declaration-choice
    title: "`const` values and a `let` accumulator"
    goal: "Use each lexical declaration according to whether its binding is reassigned."
    sourcePath: examples/declaration-choice.js
    timeoutMs: 1200
    expectedOutput: ["60"]
    claimIds: [claim-choice-rule]
    citationIds: [lexical-declarations]
  - id: declaration-bytecode
    title: "Branching, TDZ, and safe initialization"
    goal: "Run the exact var/let/const functions used for the pinned bytecode comparison."
    sourcePath: examples/declaration-bytecode.js
    timeoutMs: 1200
    expectedOutput: ["undefined", "ReferenceError", "ReferenceError", "7", "7"]
    claimIds: [claim-branch-does-not-create-tdz, claim-var-early-read, claim-v8-bytecode-capture]
    citationIds: [lexical-declarations, variable-statement, declarative-environment, v8-hole-checks]
