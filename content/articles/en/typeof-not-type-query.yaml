id: "typeof-not-type-query-en"
slug: "typeof-not-type-query"
locale: "en"
sourceContentHash: "5c801eba9fce7f25"
title: "typeof is not a type system query"
eyebrow: "Evaluation → Reference Record → value → result"
dek: "Follow operand evaluation, Reference Records, GetValue, and [[Call]] to see exactly what the returned strings mean."
status: "TECH_REVIEW"
sourceSnapshot: "ECMA-262-ES2026"
readingMinutes: 16
learningObjectives:
  - "Distinguish an unresolvable name from an existing binding in its TDZ."
  - "Explain typeof strings through the algorithm's ordered steps."
  - "Separate language type, presence of [[Call]], and constructability."
  - "Identify what ECMAScript and HTML each contribute to document.all."
prerequisites:
  - "values-types-memory"
  - "const-let-var"
  - "reference-call-this"
sections:
  - id: "typeof-model"
    title: "A useful shortcut with a precise boundary"
    tabLabel: "Mental model"
    mode: "human"
    exampleIds:
      - "typeof-primitive-results"
    blocks:
      - id: "typeof-model-intro"
        type: "prose"
        body: "For a primitive number or string, “typeof tells me the type” is a useful shortcut. But the operator evaluates an expression, not a type-system record. Its output is a String selected by a specific algorithm. The first distinction is between evaluating an expression to a value or Reference Record, and then reading the value described by a Reference Record."
      - id: "typeof-thesis-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-not-type-query"
            classification: "DERIVED"
            text: 'The result strings are not a one-to-one view of language types: Null is reported as `"object"`, while Object values are split by `[[Call]]` and the host exception. `"function"` is a result category, not a ninth ECMAScript language type.'
            citationIds:
              - "typeof"
              - "language-types"
              - "is-callable"
            sourceFingerprint: "2899bb9844a8232a95be85caed79364babaf09df97986a2feeb82fb94c1ee093"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-model-link"
        type: "prose"
        body: "The foundations are in [Values, types, and memory](/en/guide/values-types-memory/): ECMAScript language values have language types; Reference Record is a specification mechanism used to describe evaluation. It is not a JavaScript object whose “type” you can inspect. Here we follow the operator across that boundary."
      - id: "typeof-roadmap"
        type: "note"
        title: "The pressure test"
        body: 'A missing bare name can produce `"undefined"`, while an existing but uninitialized lexical binding throws. If the mental model cannot explain both, it is incomplete. Neither result says that JavaScript lacks a type system.'
        tone: "insight"
  - id: "typeof-algorithm"
    title: "Evaluate first; classify only after the reference boundary"
    tabLabel: "Operator trace"
    mode: "normative"
    exampleIds:
      - "typeof-evaluation-effects"
    blocks:
      - id: "typeof-algorithm-order"
        type: "prose"
        body: 'Read ES2026 §13.5.3.1 in order. Step 1 evaluates the operand. Step 2 recognizes an unresolvable Reference Record and returns early. Step 3 applies `GetValue`. Steps 4–10 cover primitives, including the explicit null branch. Step 11 establishes that the remaining value is an Object. Step 12 handles the host''s `[[IsHTMLDDA]]` case; step 13 tests `[[Call]]`; step 14 returns `"object"`. Reordering those branches changes the explanation.'
      - id: "typeof-algorithm-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-evaluates-operand"
            classification: "NORMATIVE"
            text: "`typeof` first evaluates its operand. Unless the unresolvable-Reference shortcut applies, it then performs `GetValue`. An abrupt completion from either step propagates; the operator does not suppress side effects or exceptions."
            citationIds:
              - "typeof"
              - "get-value"
            sourceFingerprint: "537803b82bb0b464895d210ae01b7104ba7ec20092ee55177b41996ae2216a0e"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-unresolvable-reference"
            classification: "NORMATIVE"
            text: 'When operand evaluation returns a Reference Record whose `[[Base]]` is `unresolvable`, `typeof` returns the string `"undefined"` before `GetValue`. This branch does not read a value and does not create a binding.'
            citationIds:
              - "typeof"
              - "unresolvable-reference"
              - "reference-record"
            sourceFingerprint: "beba7e169198fa5a93186c69c8ed8bbd50982bd7d63a16c5da15b037c1ee03b4"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-operations"
        type: "operations"
        operations:
          - id: "typeof-op-evaluation"
            name: "typeof — Evaluation"
            kind: "runtime-semantics"
            summary: "Evaluates the operand and selects an operator result."
            citationId: "typeof"
          - id: "typeof-op-reference"
            name: "Reference Record"
            kind: "record"
            summary: "Describes an access path, including its base and referenced name."
            citationId: "reference-record"
          - id: "typeof-op-getvalue"
            name: "GetValue"
            kind: "abstract-operation"
            summary: "Returns an existing value or reads the value described by a Reference Record."
            citationId: "get-value"
      - id: "typeof-effects-explanation"
        type: "prose"
        body: "A literal such as `1` supplies a value. A bare identifier such as `value` supplies a Reference Record. A property expression such as `source.value` also supplies a Reference Record, and `GetValue` may invoke a getter. In `typeof makeValue()`, the call happens while evaluating the operand. The counters in the fixture make these effects observable."
      - id: "typeof-compound-limit"
        type: "note"
        title: "The shortcut is narrow"
        body: "`typeof missing.property` can throw while evaluating the operand: reading `missing` is needed to evaluate the property access. The shortcut only applies when the completed operand evaluation itself returns an unresolvable Reference Record. Likewise, a getter that throws is not protected by `typeof`."
        tone: "warning"
  - id: "typeof-references"
    title: "Unresolvable is different from uninitialized"
    tabLabel: "Missing name / TDZ"
    mode: "observable"
    exampleIds:
      - "typeof-name-resolution"
      - "typeof-evaluation-effects"
    blocks:
      - id: "typeof-reference-setup"
        type: "prose"
        body: "Use a fresh name with no binding anywhere in the environment chain. Compare it with a block containing `let value;` below a read. Block instantiation creates that lexical binding before any statement in the block executes. The later declaration initializes it; these are separate events."
      - id: "trace-typeof-missing-name"
        type: "trace"
        steps:
          - id: "missing-resolve"
            operation: "IdentifierReference → ResolveBinding"
            label: "Resolve the name"
            detail: "Identifier evaluation starts at the current lexical environment."
            citationId: "identifier-evaluation"
          - id: "missing-search"
            operation: "GetIdentifierReference"
            label: "Reach the end of the chain"
            detail: "No environment has the binding; a null outer environment yields [[Base]]: unresolvable."
            citationId: "get-identifier-reference"
          - id: "missing-return"
            operation: "typeof → IsUnresolvableReference"
            label: "Return before reading"
            detail: 'The operator returns the string "undefined". GetValue does not run.'
            citationId: "typeof"
      - id: "trace-typeof-tdz"
        type: "trace"
        steps:
          - id: "tdz-create"
            operation: "BlockDeclarationInstantiation"
            label: "Create the binding"
            detail: "The block's let binding exists but has not been initialized."
            citationId: "block-instantiation"
          - id: "tdz-resolve"
            operation: "ResolveBinding → GetIdentifierReference"
            label: "Find the binding"
            detail: "HasBinding finds the name. The Reference Record base is the Environment Record, not unresolvable."
            citationId: "get-identifier-reference"
          - id: "tdz-read"
            operation: "typeof → GetValue"
            label: "Take the ordinary read path"
            detail: "The early-return test is false. GetValue delegates to the environment's GetBindingValue."
            citationId: "get-value"
          - id: "tdz-throw"
            operation: "GetBindingValue"
            label: "Reject the uninitialized read"
            detail: "The uninitialized binding causes ReferenceError, which propagates out of typeof."
            citationId: "binding-value"
      - id: "typeof-reference-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-tdz-reference-error"
            classification: "DERIVED"
            text: "A lexical binding before initialization is resolvable: name resolution finds its Environment Record. The shortcut is skipped, and `GetValue` reaches `GetBindingValue`, which throws `ReferenceError` for the uninitialized binding."
            citationIds:
              - "typeof"
              - "get-identifier-reference"
              - "get-value"
              - "binding-value"
              - "block-instantiation"
              - "lexical-declarations"
            sourceFingerprint: "cc3ee8bb6cd2c274cd986871b4b2abbae17c3e12e7ba1eebaf6672b5fad8970d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-observed-reference-boundary"
            classification: "OBSERVABLE"
            text: "The fixtures print `undefined` for the missing bare name, catch `ReferenceError` for TDZ access and a missing-name property expression, and print `undefined` after `let value;` executes. Separate getter and function-call counters each reach 1 during operand evaluation."
            citationIds:
              - "typeof"
              - "get-value"
              - "binding-value"
              - "lexical-declarations"
            sourceFingerprint: "2774bcbad5233715537963bbe82edbe719448bc2f9bc1ae2cc58f7a4937e663d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-reference-conclusion"
        type: "prose"
        body: 'After `let value;` actually executes, it initializes the binding to undefined. Then `typeof value` returns `"undefined"` through value classification, not the missing-name shortcut. The fixture catches the earlier error so execution can reach that declaration. If the error escaped the block, the remaining statements would not run. See [const, let, and var](/en/guide/const-let-var/) for binding lifecycle and shadowing.'
  - id: "typeof-results"
    title: "The strings do not name all the language types"
    tabLabel: "Result categories"
    mode: "human"
    exampleIds:
      - "typeof-primitive-results"
      - "typeof-object-collapse"
    blocks:
      - id: "typeof-types-list"
        type: "prose"
        body: "ECMA-262's eight language types are Undefined, Null, Boolean, String, Symbol, Number, BigInt, and Object. The six non-null primitive categories line up with familiar typeof strings. Null is the first mismatch; callable Objects are another. Capitalized specification names and quoted lowercase result strings refer to different things."
      - id: "typeof-mapping-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-primitive-mapping"
            classification: "NORMATIVE"
            text: 'Undefined, Boolean, Number, BigInt, String, and Symbol values produce `"undefined"`, `"boolean"`, `"number"`, `"bigint"`, `"string"`, and `"symbol"`, respectively. These are the six non-null primitive categories.'
            citationIds:
              - "typeof"
              - "language-types"
            sourceFingerprint: "dcceeb61fd71f3b65a60d229659ac07e267f770a83dd742aada3be4d585f456f"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-null-mismatch"
            classification: "DERIVED"
            text: '`null` belongs to the Null language type, while the operator explicitly selects `"object"` for it. That result does not turn `null` into an Object value.'
            citationIds:
              - "language-types"
              - "typeof"
            sourceFingerprint: "e4ceb4f9fc05cdb397b151ded448dd983eddb7ac6d04cd34304a99a60ed885a0"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-object-collapse"
            classification: "NORMATIVE"
            text: 'An Object that reaches the final branch—without the applicable `[[IsHTMLDDA]]` exception and without `[[Call]]`—produces `"object"`. That branch does not distinguish arrays, regular expressions, dates, wrappers, or other object kinds.'
            citationIds:
              - "typeof"
            sourceFingerprint: "9a665d1f710aa6a5a26e1327a436b4383d9fcab9bd0f15e6d96055a65585b19e"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-observed-result-matrix"
            classification: "OBSERVABLE"
            text: "The fixtures print the six non-null primitive result strings, `null:object`, and `object` for each tested object, array, regular expression, date, and Number wrapper. The observations demonstrate these inputs; the general rule comes from the cited operator algorithm."
            citationIds:
              - "typeof"
              - "language-types"
            sourceFingerprint: "c3274c8f77fbce4f2a14cfccee3357458e66fbb56a5356c0aab81875151088a9"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-null-history"
        type: "note"
        title: "What the null branch proves"
        body: "Today's requirement is explicit. This article does not attach a historical cause to it: the operator clause is evidence for the current behavior, not for a story about the first implementation's tags. A historical explanation would need its own source and classification."
        tone: "insight"
      - id: "typeof-collapse-limit"
        type: "prose"
        body: 'The object fixture deliberately chooses values with different behavior: an object literal, array, RegExp, Date, and Number wrapper. All reach the same final branch. `typeof x === "object"` neither identifies one of these kinds nor excludes null. The result is a broad category, not a description of storage or a reflection interface.'
  - id: "typeof-capabilities"
    title: "An internal call method does not promise a successful call"
    tabLabel: "Call / construct"
    mode: "normative"
    exampleIds:
      - "typeof-call-construct"
      - "typeof-proxy-boundary"
    blocks:
      - id: "typeof-capability-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-call-slot"
            classification: "NORMATIVE"
            text: 'After the applicable `[[IsHTMLDDA]]` check, an Object with an internal `[[Call]]` method produces `"function"`. The operator tests for the method''s presence; it does not invoke it or call `IsCallable`. `IsCallable` uses the same Object-plus-`[[Call]]` criterion.'
            citationIds:
              - "typeof"
              - "is-callable"
            sourceFingerprint: "9529ceee0b9c705165830a61faf92858fecb6d23c3abbbf364f6f20a44062468"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-not-constructability"
            classification: "DERIVED"
            text: '`typeof` never tests `[[Construct]]`. An ordinary function declaration, an arrow, and a class constructor all produce `"function"`, but the arrow has no `[[Construct]]`; the two constructor forms do. This says nothing about whether a particular construction will complete successfully.'
            citationIds:
              - "typeof"
              - "is-constructor"
              - "function-instantiation"
              - "arrow-instantiation"
              - "class-definition"
              - "make-constructor"
            sourceFingerprint: "cc135dabaaef02a8438688ddea10b07a63154a01ff73cfa46704756489cf8fa9"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-typeof-class-call-guard"
            classification: "DERIVED"
            text: 'Both default and explicit class constructors have `[[Call]]` and produce `"function"`, yet direct invocation throws. For an explicit constructor, ECMAScript function `[[Call]]` rejects `[[IsClassConstructor]]`. For `class C {}`, the default constructor instead rejects an undefined `NewTarget`. `new` uses the construct path.'
            citationIds:
              - "typeof"
              - "class-definition"
              - "function-call"
              - "make-constructor"
              - "is-callable"
            sourceFingerprint: "3f58298a385e274e6471b804a582187c5a188d87a72416ff60d879e135971750"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "trace-typeof-callable-object"
        type: "trace"
        steps:
          - id: "callable-value"
            operation: "Evaluation → GetValue"
            label: "Obtain an Object value"
            detail: "Reading F, arrow, or C obtains an Object. No body is invoked by typeof."
            citationId: "get-value"
          - id: "callable-slot"
            operation: "typeof — [[Call]] branch"
            label: "Inspect the internal method"
            detail: 'After excluding primitives and the HTMLDDA case, presence of [[Call]] selects "function".'
            citationId: "typeof"
          - id: "callable-call"
            operation: "[[Call]]"
            label: "Separate classification from invocation"
            detail: "Direct invocation is a later operation. An explicit class constructor rejects it through [[IsClassConstructor]]; a default constructor rejects undefined NewTarget."
            citationId: "class-definition"
          - id: "callable-construct"
            operation: "IsConstructor → [[Construct]]"
            label: "Check construction separately"
            detail: "new requires [[Construct]], which typeof never tests. The ordinary function and both class fixtures have it; the arrow does not."
            citationId: "is-constructor"
      - id: "typeof-class-precision"
        type: "prose"
        body: "In the specification's structural sense, the class constructor is callable: `IsCallable(C)` would be true because `[[Call]]` is present. That does not mean `C()` is permitted to complete normally. For `class C {}`, ClassDefinitionEvaluation creates a built-in default constructor whose steps reject undefined `NewTarget`. For `class Explicit { constructor() {} }`, it marks an ECMAScript function using MakeClassConstructor, and ECMAScript function `[[Call]]` rejects that mark. The fixture checks both paths. The model does not need to pretend they are ordinary function calls."
      - id: "typeof-capability-link"
        type: "prose"
        body: "The mechanisms behind `Call`, `Construct`, and `new` are developed in [References, calls, and this](/en/guide/reference-call-this/). Here their role is narrower: typeof neither constructs nor calls the obtained object, so it cannot predict the outcome of either operation."
      - id: "typeof-proxy-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-proxy-boundary"
            classification: "DERIVED"
            text: '`ProxyCreate` installs `[[Call]]` when the target is callable. Reading an ordinary initialized binding containing that Proxy and applying `typeof` invokes no Proxy trap. Revocation clears target and handler but leaves `[[Call]]` present, so a revoked callable Proxy still produces `"function"`; calling it throws.'
            citationIds:
              - "typeof"
              - "proxy-create"
              - "proxy-call"
              - "proxy-revocable"
            sourceFingerprint: "4994f1fc69119429d89c671467bb5befbbbd97cf96f9894700321d28afb0a551"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-observed-capability-boundary"
            classification: "OBSERVABLE"
            text: 'In the fixtures, the regular function, arrow, both class constructors, and callable Proxy produce `"function"`. Construction of the arrow and direct calls of both class constructors throw `TypeError`. Revocation leaves the Proxy''s typeof result unchanged, but invocation throws.'
            citationIds:
              - "typeof"
              - "class-definition"
              - "function-call"
              - "arrow-instantiation"
              - "proxy-create"
              - "proxy-call"
              - "proxy-revocable"
            sourceFingerprint: "7490ff48fd3259fbf82225b625cf057d9764fdd35468eaefe7e68cc5d4dac40a"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-proxy-scope"
        type: "note"
        title: "Why the Proxy case belongs here"
        body: "The zero apply-trap counter and the revoked Proxy distinguish method presence from method execution. The claim is about `typeof proxy` with an ordinary initialized binding. `typeof proxy.property` may run a get trap during operand evaluation. A handler cannot make a Proxy callable merely by defining apply when its target is not callable."
        tone: "insight"
  - id: "typeof-host-boundary"
    title: "The browser supplies an extra case"
    tabLabel: "Host and conclusions"
    mode: "observable"
    exampleIds: []
    blocks:
      - id: "typeof-host-intro"
        type: "prose"
        body: 'In a browser document, `typeof document.all === "undefined"` follows from two specifications. HTML supplies the object and its internal slot; ECMAScript supplies the conditional operator branch. This is not the same route as an unresolvable identifier. The operand successfully yields an Object before classification.'
      - id: "typeof-host-claims"
        type: "claims"
        claims:
          - id: "claim-typeof-html-dda-hook"
            classification: "NORMATIVE"
            text: 'In a web browser or another host supporting `[[IsHTMLDDA]]`, the Normative Optional step returns `"undefined"` for an Object with that slot. It runs before the `[[Call]]` check. ECMA-262 itself does not create these objects.'
            citationIds:
              - "typeof"
              - "html-dda"
            sourceFingerprint: "262c8dfdb4d510c54a64a39b466750a1b1d8e98f4264f6b7852ed8f3bbb4269d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
          - id: "claim-document-all-host-object"
            classification: "HOST_DEFINED"
            text: 'HTML requires `document.all` to return an `HTMLAllCollection`, whose objects have both `[[IsHTMLDDA]]` and a custom `[[Call]]`. Combining that host requirement with the ECMA-262 branch explains `typeof document.all === "undefined"`; the object is not the primitive undefined value.'
            citationIds:
              - "html-document-all"
              - "html-all-collection"
              - "typeof"
              - "html-dda"
            sourceFingerprint: "1fe23b99a844d058d29a923a4b86f754466f1e0de2c714ae1827aa7414c7580d"
            confidence: 0.99
            reviewStatus: "TECH_REVIEW"
      - id: "typeof-host-environment"
        type: "note"
        title: "Browser document only"
        body: "HTMLAllCollection has both [[IsHTMLDDA]] and [[Call]], but the earlier slot check wins. “Normative Optional” does not mean a conforming browser may arbitrarily choose the result: the browser condition and HTML requirement make this the specified browser behavior. Node and this site's Web Worker laboratory do not supply a browser document, so this snippet is explanatory, not an executable laboratory fixture."
        tone: "warning"
      - id: "typeof-practical-primitives"
        type: "prose"
        body: 'Use typeof when its categories match the question: distinguishing a Number primitive from a String or BigInt primitive is a direct use of the algorithm. `"number"` does not promise a finite number, an integer, or any application-specific validity. A result of `"undefined"` does not by itself distinguish a missing bare name, an initialized undefined value, and the HTML legacy case.'
      - id: "typeof-practical-references"
        type: "prose"
        body: 'Testing a possibly absent global name with typeof is useful when name resolution actually produces an unresolvable Reference. A lexical declaration in scope can instead put that same spelling in a TDZ. `"function"` establishes the operator''s [[Call]] branch, not constructability or successful invocation; the HTML legacy object also prevents treating that test as a universal equivalence with IsCallable.'
      - id: "typeof-evidence-scope"
        type: "note"
        title: "What has been checked"
        body: "The six portable fixtures run in content validation. No engine-version baseline, bytecode, representation artifact, or browser-document capture is claimed for this topic. Normative statements cite the pinned ES2026 source; the host statement also cites a fixed WHATWG HTML snapshot. These drafts remain under technical and locale review."
        tone: "insight"
