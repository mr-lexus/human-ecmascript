examples:
  - id: "typeof-primitive-results"
    title: "Primitives and null"
    goal: "Compare result strings with the primitive language types."
    sourcePath: "examples/typeof-primitives.js"
    timeoutMs: 1000
    expectedOutput:
      - "undefined:undefined"
      - "boolean:boolean"
      - "number:number"
      - "bigint:bigint"
      - "string:string"
      - "symbol:symbol"
      - "null:object"
    claimIds:
      - "claim-typeof-primitive-mapping"
      - "claim-typeof-null-mismatch"
      - "claim-observed-result-matrix"
    citationIds:
      - "typeof"
      - "language-types"
  - id: "typeof-object-collapse"
    title: "Different objects, one result"
    goal: "Show the limited discrimination of the final object branch."
    sourcePath: "examples/typeof-object-collapse.js"
    timeoutMs: 1000
    expectedOutput:
      - "object:object"
      - "array:object"
      - "regexp:object"
      - "date:object"
      - "boxed-number:object"
    claimIds:
      - "claim-typeof-object-collapse"
      - "claim-typeof-not-type-query"
      - "claim-observed-result-matrix"
    citationIds:
      - "typeof"
  - id: "typeof-name-resolution"
    title: "Missing name, member access, and TDZ"
    goal: "Catch both errors, then let the lexical declaration initialize the binding."
    sourcePath: "examples/typeof-name-resolution.js"
    timeoutMs: 1000
    expectedOutput:
      - "missing:undefined"
      - "missing-member:ReferenceError"
      - "tdz:ReferenceError"
      - "initialized:undefined"
    claimIds:
      - "claim-typeof-unresolvable-reference"
      - "claim-typeof-tdz-reference-error"
      - "claim-observed-reference-boundary"
    citationIds:
      - "typeof"
      - "get-identifier-reference"
      - "get-value"
      - "binding-value"
      - "block-instantiation"
      - "lexical-declarations"
  - id: "typeof-evaluation-effects"
    title: "Operand effects still happen"
    goal: "Count getter reads and calls performed by operand evaluation and GetValue."
    sourcePath: "examples/typeof-evaluation-effects.js"
    timeoutMs: 1000
    expectedOutput:
      - "getter-result:number"
      - "getter-reads:1"
      - "call-result:object"
      - "calls:1"
    claimIds:
      - "claim-typeof-evaluates-operand"
      - "claim-observed-reference-boundary"
    citationIds:
      - "typeof"
      - "get-value"
  - id: "typeof-call-construct"
    title: "Function, arrow, and both class paths"
    goal: "Compare typeof with actual calls and construction; catch TypeError by name."
    sourcePath: "examples/typeof-call-construct.js"
    timeoutMs: 1000
    expectedOutput:
      - "regular-type:function"
      - "arrow-type:function"
      - "class-type:function"
      - "explicit-class-type:function"
      - "regular-call:ok"
      - "regular-new:ok"
      - "arrow-call:ok"
      - "arrow-new:TypeError"
      - "class-call:TypeError"
      - "class-new:ok"
      - "explicit-class-call:TypeError"
      - "explicit-class-new:ok"
    claimIds:
      - "claim-typeof-call-slot"
      - "claim-typeof-not-constructability"
      - "claim-typeof-class-call-guard"
      - "claim-observed-capability-boundary"
    citationIds:
      - "typeof"
      - "function-instantiation"
      - "arrow-instantiation"
      - "class-definition"
      - "function-call"
      - "make-constructor"
  - id: "typeof-proxy-boundary"
    title: "Proxy method presence and revocation"
    goal: "Observe no apply trap during typeof and unchanged classification after revocation."
    sourcePath: "examples/typeof-proxy-boundary.js"
    timeoutMs: 1000
    expectedOutput:
      - "callable:function"
      - "apply-traps:0"
      - "noncallable:object"
      - "revoked:function"
      - "revoked-call:TypeError"
    claimIds:
      - "claim-typeof-call-slot"
      - "claim-typeof-proxy-boundary"
      - "claim-observed-capability-boundary"
    citationIds:
      - "typeof"
      - "proxy-create"
      - "proxy-call"
      - "proxy-revocable"
