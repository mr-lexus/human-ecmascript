examples:
  - id: method-call
    title: "Method-call receiver"
    goal: "Observe that a property Reference supplies the base object as this."
    sourcePath: examples/method-call.js
    timeoutMs: 1200
    expectedOutput: ["true", "reference"]
    claimIds: [claim-member-reference, claim-evaluatecall-this]
    citationIds: [evaluate-call]
  - id: detached-call
    title: "Detached function"
    goal: "Observe the loss of the original base after value extraction."
    sourcePath: examples/detached-call.js
    timeoutMs: 1200
    expectedOutput: ["true"]
    claimIds: [claim-detach-loses-reference]
    citationIds: [get-value, evaluate-call]
  - id: comma-call
    title: "Comma operator extraction"
    goal: "Observe another expression form that returns the function value rather than the property Reference."
    sourcePath: examples/comma-call.js
    timeoutMs: 1200
    expectedOutput: ["true"]
    claimIds: [claim-detach-loses-reference]
    citationIds: [get-value, evaluate-call]
  - id: getter-call
    title: "Getter returns a function"
    goal: "Show that the call still derives this from the surrounding property Reference."
    sourcePath: examples/getter-call.js
    timeoutMs: 1200
    expectedOutput: ["true"]
    claimIds: [claim-getvalue-receiver, claim-evaluatecall-this]
    citationIds: [get-value, evaluate-call]
  - id: computed-key
    title: "Computed property key"
    goal: "Expose ToPropertyKey before invocation."
    sourcePath: examples/computed-key.js
    timeoutMs: 1200
    expectedOutput: ["key → call"]
    claimIds: [claim-evaluation-order]
    citationIds: [to-property-key, property-accessors]
  - id: proxy-order
    title: "Lookup, arguments, body"
    goal: "Observe property lookup, argument evaluation, and function-body order."
    sourcePath: examples/proxy-order.js
    timeoutMs: 1200
    expectedOutput: ["get:method → argument → call:7"]
    claimIds: [claim-evaluation-order]
    citationIds: [evaluate-call]
  - id: non-callable
    title: "Non-callable property"
    goal: "Observe failure after the property value has been obtained."
    sourcePath: examples/non-callable.js
    timeoutMs: 1200
    expectedOutput: ["TypeError"]
    claimIds: [claim-evaluatecall-this]
    citationIds: [evaluate-call, call]
