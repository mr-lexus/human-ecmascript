id: reference-call-this
slug: reference-call-this
locale: en
sourceContentHash: 6d6b90ec1941ba90
title: "Where `this` really comes from"
eyebrow: "Reference Records → property access → calls"
dek: >-
  A method does not permanently own its receiver. Follow the temporary Reference Record
  created by a member expression and see how the call expression turns it into `this`.
status: READY
sourceSnapshot: ECMA-262-ES2026
readingMinutes: 22
learningObjectives:
  - Distinguish a Reference Record from the value obtained through GetValue.
  - Explain why method syntax preserves a receiver while a detached function call does not.
  - Explain why `new` delegates to a constructor instead of directly promising a fresh object.
  - Predict property-key, getter, argument, and call evaluation order.
prerequisites:
  - Expressions produce intermediate specification values.
  - Strict functions receive undefined instead of a substituted global this value.
sections:
  - id: mental-model
    title: "The missing link is a Reference"
    mode: human
    blocks:
      - id: mental-model-prose
        type: prose
        body: >-
          JavaScript evaluates `obj.method` to a temporary specification-only Reference Record.
          It remembers both the base object and the property name. When parentheses immediately
          call that reference, the base becomes the receiver. Assigning the function to another
          variable first extracts only the function value, so the original base is gone.
      - id: mental-model-claims
        type: claims
        claims:
          - id: claim-reference-record
            classification: NORMATIVE
            text: "A property Reference Record carries a base value and a referenced name; it is not itself an ECMAScript language value."
            citationIds: [reference-record]
            sourceFingerprint: a4eddf680870da11
            confidence: 1
            reviewStatus: READY
          - id: claim-member-reference
            classification: DERIVED
            text: "Evaluating a member expression keeps enough information to distinguish `obj.method()` from calling the same function after value extraction."
            citationIds: [property-accessors, evaluate-call]
            sourceFingerprint: f20b9c5fb2e6163c
            confidence: 0.98
            reviewStatus: READY
      - id: operation-map
        type: operations
        operations:
          - id: op-reference-record
            name: Reference Record
            kind: record
            summary: "Carries the base, referenced name, strictness, and optional thisValue."
            citationId: reference-record
          - id: op-get-value
            name: GetValue
            kind: abstract-operation
            summary: "Turns a Reference into the value needed by the call."
            citationId: get-value
          - id: op-evaluate-call
            name: EvaluateCall
            kind: runtime-semantics
            summary: "Recovers the receiver before evaluating and invoking the argument list."
            citationId: evaluate-call
          - id: op-call
            name: Call
            kind: abstract-operation
            summary: "Invokes the function's [[Call]] internal method with the chosen this value."
            citationId: call
  - id: normative-trace
    title: "Normative trace of `obj.method()`"
    mode: normative
    blocks:
      - id: normative-prose
        type: prose
        body: >-
          The important hand-off happens before the function body starts. Property access creates
          a Reference, EvaluateCall derives both the callable value and the receiver, and Call passes
          that receiver into the function's internal call machinery.
      - id: call-trace
        type: trace
        steps:
          - id: trace-base
            label: "1. Evaluate the base"
            operation: MemberExpression
            detail: "Evaluate `obj` and retain its object value as the base."
            citationId: property-accessors
          - id: trace-key
            label: "2. Resolve the property key"
            operation: ToPropertyKey
            detail: "For bracket notation, convert the computed expression before creating the reference."
            citationId: to-property-key
          - id: trace-reference
            label: "3. Create a Reference"
            operation: Reference Record
            detail: "The base is `obj`; the referenced name is `method`."
            citationId: reference-record
          - id: trace-value
            label: "4. Read the function"
            operation: GetValue
            detail: "Property access invokes the base object's [[Get]] with the same receiver."
            citationId: get-value
          - id: trace-this
            label: "5. Choose thisValue"
            operation: EvaluateCall
            detail: "Because the original result is a property Reference, its base becomes thisValue."
            citationId: evaluate-call
          - id: trace-arguments
            label: "6. Evaluate arguments"
            operation: ArgumentListEvaluation
            detail: "Argument expressions run after the callable and receiver have been determined."
            citationId: evaluate-call
          - id: trace-call
            label: "7. Invoke"
            operation: Call
            detail: "Call the function with the selected thisValue and argument list."
            citationId: call
      - id: normative-claims
        type: claims
        claims:
          - id: claim-evaluatecall-this
            classification: NORMATIVE
            text: "EvaluateCall obtains thisValue from a property Reference before it evaluates the argument list."
            citationIds: [evaluate-call, get-this-value]
            sourceFingerprint: eef6eb3136422ebc
            confidence: 1
            reviewStatus: READY
          - id: claim-getvalue-receiver
            classification: NORMATIVE
            text: "GetValue reads a property Reference by calling the base object's [[Get]] internal method with the Reference's receiver."
            citationIds: [get-value, object-get]
            sourceFingerprint: d833185a549caf49
            confidence: 1
            reviewStatus: READY
  - id: construction-call
    title: "`new` requests construction; it does not mean “create an object”"
    mode: normative
    blocks:
      - id: construction-prose
        type: prose
        body: >-
          “`new` creates an object” is a useful first approximation, but it is not a definition of
          the operator. Lexically, `new` is a reserved keyword; in an expression, ECMA-262 specifies
          it as the `new` operator. EvaluateNew evaluates the value after `new` and the arguments,
          rejects a value that is not a constructor, and delegates to Construct. Construct then
          invokes that value's `[[Construct]]` internal method. Object allocation and the choice of
          the final result belong to that construction protocol, not to the `new` token by itself.
      - id: construction-trace
        type: trace
        steps:
          - id: construct-evaluate
            label: "1. Evaluate the constructor and arguments"
            operation: EvaluateNew
            detail: "Obtain the candidate constructor value and build its argument list."
            citationId: evaluate-new
          - id: construct-check
            label: "2. Check constructability"
            operation: IsConstructor
            detail: "Throw TypeError when the value has no `[[Construct]]` internal method."
            citationId: evaluate-new
          - id: construct-delegate
            label: "3. Delegate construction"
            operation: Construct
            detail: "Call the constructor object's own `[[Construct]]` internal method."
            citationId: construct
          - id: construct-this
            label: "4. Prepare `this` for an ordinary base constructor"
            operation: "[[Construct]]"
            detail: "Create a candidate object from `newTarget.prototype` and bind that object as `this`."
            citationId: function-construct
          - id: construct-body
            label: "5. Run the constructor body"
            operation: OrdinaryCallEvaluateBody
            detail: "Execute the function body with the prepared `this` and the evaluated arguments."
            citationId: function-construct
          - id: construct-result
            label: "6. Select the result"
            operation: "[[Construct]]"
            detail: "Return an explicitly returned Object; otherwise, for a base constructor, return the prepared `this` object."
            citationId: function-construct
      - id: construction-claims
        type: claims
        claims:
          - id: claim-new-delegates
            classification: NORMATIVE
            text: "The `new` operator does not itself run an object-allocation algorithm: EvaluateNew checks IsConstructor and delegates to Construct, which invokes the selected object's `[[Construct]]` internal method."
            citationIds: [evaluate-new, construct]
            sourceFingerprint: d7fa66217a54d5fc
            confidence: 1
            reviewStatus: READY
          - id: claim-ordinary-construct-this
            classification: NORMATIVE
            text: "For an ordinary base constructor, `[[Construct]]` creates a candidate object, binds it as `this`, runs the body, and returns either an explicitly returned Object or that candidate. Returning a primitive does not replace the candidate."
            citationIds: [function-construct]
            sourceFingerprint: e3697be72d88fbdc
            confidence: 1
            reviewStatus: READY
          - id: claim-constructability-not-return
            classification: NORMATIVE
            text: "Whether a function is constructable is determined by the presence of `[[Construct]]`, not by whether its body has a `return`. Ordinary function declarations are made constructors when created; arrow functions are not."
            citationIds: [ordinary-function-instantiation, arrow-function-instantiation]
            sourceFingerprint: fea937096e9edc96
            confidence: 1
            reviewStatus: READY
          - id: claim-new-result-not-fresh
            classification: OBSERVABLE
            text: "The object produced by `new C()` is not guaranteed to be the fresh candidate associated with `this`: an ordinary constructor can return another Object, and a Proxy construct trap can return an already existing Object."
            citationIds: [function-construct, proxy-construct]
            sourceFingerprint: 0e7686fbf7e0d47c
            confidence: 1
            reviewStatus: READY
      - id: construction-boundaries
        type: note
        tone: warning
        title: "Callable and constructable are separate capabilities"
        body: >-
          Ordinary `function` declarations and expressions normally have both `[[Call]]` and
          `[[Construct]]`. Arrow, async, generator, and concise method functions are callable but
          are not constructors. Classes are constructors but throw when called without `new`.
          Therefore neither “every function can be used with `new`” nor “every constructor can be
          called with and without `new`” is a safe rule.
  - id: observable-cases
    title: "Eight observable pressure tests"
    mode: observable
    blocks:
      - id: observable-prose
        type: prose
        body: >-
          The examples below isolate one transition at a time. Run them in the browser sandbox,
          then compare the recorded engine evidence. A browser result describes only the current
          browser; it is never presented as the multi-engine matrix.
      - id: observable-claims
        type: claims
        claims:
          - id: claim-detach-loses-reference
            classification: OBSERVABLE
            text: "Assigning `obj.method` to a variable performs value extraction; calling that variable no longer supplies `obj` as the receiver."
            citationIds: [get-value, evaluate-call]
            sourceFingerprint: f98c12c16ad837bd
            confidence: 0.99
            reviewStatus: READY
          - id: claim-evaluation-order
            classification: OBSERVABLE
            text: "Property lookup happens before argument evaluation, and both happen before the function body runs."
            citationIds: [property-accessors, evaluate-call]
            sourceFingerprint: 142a00c38ed74623
            confidence: 0.99
            reviewStatus: READY
      - id: evaluation-order-note
        type: note
        tone: insight
        title: "A getter may return the function without erasing the receiver"
        body: >-
          `obj.method()` calls the value returned by the getter with `obj` as this because the call
          still receives the property Reference produced by the member expression.
  - id: implementation-boundary
    title: "What V8 is allowed to change"
    mode: v8
    blocks:
      - id: v8-prose
        type: prose
        body: >-
          V8 does not have to allocate a JavaScript-visible Reference Record. Ignition bytecode,
          inline caches, and optimized tiers may encode or eliminate the intermediate state as long
          as observable behavior follows the specification. Implementation artifacts are therefore
          versioned evidence, never normative definitions.
      - id: v8-claims
        type: claims
        claims:
          - id: claim-v8-boundary
            classification: V8_IMPLEMENTATION
            text: "Ignition is V8's bytecode interpreter; its bytecode and optimization tiers are implementation details that may change between versions."
            citationIds: [v8-ignition]
            sourceFingerprint: 50f2ac0e841920ca
            confidence: 0.95
            reviewStatus: READY
      - id: v8-warning
        type: note
        tone: implementation
        title: "Implementation is not the standard"
        body: "Use this layer to understand one pinned V8 build, not to infer requirements for every ECMAScript engine."
