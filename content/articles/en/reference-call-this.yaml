        claim-new-delegates,
        claim-ordinary-construct-this,
        claim-constructability-not-return,
        claim-new-result-not-fresh,
      ]
    citationIds:
      [evaluate-new, construct, function-construct, arrow-function-instantiation, proxy-construct]
